{n:1,d:'P',type:'single',stem:'A report uses a SharePoint Online folder as its source. After you publish it, scheduled refresh fails with an invalid credentials error. Which authentication method should you set in the semantic model’s data source credentials?',options:['OAuth2 (organisational account)','Basic','Anonymous','Windows, through an on-premises gateway'],answer:0,key:'A',why:'SharePoint Online uses Microsoft Entra sign-in, so the credentials must be OAuth2 with an organisational account. No gateway is needed for this cloud source.'},
{n:2,d:'P',type:'yn',stem:'For each statement about privacy levels, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Ignoring privacy levels can improve performance, because Power Query can then combine sources more freely.',a:true},{t:'Setting a source to Public allows its data to be combined with any other source.',a:true},{t:'Privacy levels control which users can view a report in the Power BI service.',a:false}],key:'Yes, Yes, No',why:'Privacy levels govern how data can flow between sources during query evaluation. They don’t control report access.'},
{n:3,d:'P',type:'single',stem:'A 2-billion-row fact table is in a cloud SQL warehouse. Most visuals show daily totals by product, and detail rows are needed only occasionally. Visuals must be fast, and detail must always be current. What should you do?',options:['Import the whole fact table.','Keep the detail table in DirectQuery and add an imported aggregation table at day and product grain.','Use DirectQuery for every table, with no aggregations.','Use a personal gateway.'],answer:1,key:'B',why:'An imported aggregation answers most queries from memory, while detail queries fall through to the DirectQuery table.'},
{n:4,d:'P',type:'single',stem:'Two account code columns look identical, but a merge finds no matches. The source values contain hidden line-feed characters. Which transformation should you apply to both columns?',options:['Trim','Clean','Capitalize Each Word','Fill Down'],answer:1,key:'B',why:'Clean removes non-printable characters such as line feeds. Trim removes only leading and trailing spaces.'},
{n:5,d:'P',type:'single',stem:'A column holds rates such as 0.15. Visuals must show them as 15%. What should you do?',options:['Change the type to Whole Number.','Keep a decimal type and set the column’s format to Percentage.','Multiply by 100 and change the type to Text.','Change the type to Fixed decimal number.'],answer:1,key:'B',why:'Formatting as a percentage changes only the display. Converting to text would break aggregation.'},
{n:6,d:'P',type:'single',stem:'You need a FullName column that combines FirstName and LastName with a space, and both original columns must remain. What should you use?',options:['Transform > Merge Columns','Add Column > Merge Columns','Split Column by Delimiter','Group By'],answer:1,key:'B',why:'Merge Columns on the Add Column tab creates a new column and keeps the originals. On the Transform tab it replaces them.'},
{n:7,d:'P',type:'single',stem:'For each account, you need the full row of its most recent transaction. Which approach works in Power Query?',options:['Group By AccountID with the operation Max of TransactionDate only.','Group By AccountID with the operation All Rows, then add a custom column that takes the row with the latest date from each nested table (for example, with Table.Max) and expand it.','Remove Duplicates on AccountID without sorting.','Pivot the TransactionDate column.'],answer:1,key:'B',why:'All Rows keeps every column per group, so you can pick the latest row and expand its columns. Max alone returns only the date.'},
{n:8,d:'P',type:'single',stem:'Twelve monthly statement queries have identical columns. You need one new query that contains all their rows, keeping the original queries. What should you do?',options:['Merge Queries as New','Append Queries as New, choosing Three or more tables','Append Queries into the January query','Group By Month'],answer:1,key:'B',why:'Append Queries as New stacks the rows of several tables into a new query.'},
{n:9,d:'P',type:'single',stem:'In Power Query, you remove duplicates from AccountCode and get 10,000 unique rows. When you create a relationship, Power BI says the column contains duplicate values. Some codes differ only in case, such as “ACC-001” and “acc-001”. What should you do?',options:['Set the relationship to many-to-many.','Make the codes consistent (for example, Uppercase) before removing duplicates.','Change the column type to Text.','Remove Duplicates again.'],answer:1,key:'B',why:'Power Query compares text case-sensitively, but the model doesn’t, so “ACC-001” and “acc-001” count as duplicates there. Standardise the case first.'},
{n:10,d:'M',type:'single',stem:'You need a small table of score thresholds (Low, Medium, High, with minimum and maximum values), defined in DAX, for banding. Which function should you use?',options:['DATATABLE','GENERATESERIES','SUMMARIZE','VALUES'],answer:0,key:'A',why:'DATATABLE creates a calculated table from literal rows with named, typed columns.'},
{n:11,d:'M',type:'yn',stem:'For each statement about many-to-many cardinality relationships, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'You can relate two tables directly with many-to-many cardinality when neither column has unique values.',a:true},{t:'A many-to-many relationship can use a single cross-filter direction.',a:true},{t:'Totals over a many-to-many relationship always equal the sum of the visible rows.',a:false}],key:'Yes, Yes, No',why:'Many-to-many relationships are allowed and can filter in one direction, but totals may be non-additive because rows can match several values.'},
{n:12,d:'M',type:'blanks',stem:'Sales relates many-to-one to Product. Complete the calculated column on Sales that returns the product’s category.',code:`Category = [Blank 1] ( Product[Category] )`,blanks:[{options:['RELATED','RELATEDTABLE','SELECTEDVALUE'],a:0}],key:'RELATED',why:'RELATED fetches a value from the one side of a relationship for the current row. RELATEDTABLE goes the other way, returning a table.'},
{n:13,d:'M',type:'blanks',stem:'Complete the ranking measure so that tied customers share a rank and the next rank isn’t skipped (1, 2, 2, 3).',code:`Customer Rank = RANKX ( ALL ( Customer[Name] ), [Balance], , DESC, [Blank 1] )`,blanks:[{options:['Dense','Skip','ASC'],a:0}],key:'Dense',why:'Dense ranking doesn’t leave gaps after ties. Skip, the default, gives 1, 2, 2, 4.'},
{n:14,d:'M',type:'multi',pick:2,stem:'In a table by day, each row must show sales for the whole previous calendar month. Which two expressions can you use as the filter in CALCULATE?',code:true,options:["PREVIOUSMONTH ( 'Date'[Date] )","PARALLELPERIOD ( 'Date'[Date], -1, MONTH )","DATEADD ( 'Date'[Date], -1, MONTH )","DATESMTD ( 'Date'[Date] )","SAMEPERIODLASTYEAR ( 'Date'[Date] )"],answer:[0,1],key:'A, B',why:'PREVIOUSMONTH and PARALLELPERIOD return every date of the previous month. DATEADD shifts each date, giving only the same day last month.'},
{n:15,d:'M',type:'single',code:true,stem:'[Total Amount] = SUM ( Transactions[Amount] ). You need the average total spend per customer for the selected period. Which measure should you use?',options:['AVERAGE ( Transactions[Amount] )','AVERAGEX ( VALUES ( Transactions[CustomerID] ), [Total Amount] )','DIVIDE ( [Total Amount], COUNTROWS ( Transactions ) )','AVERAGEX ( Transactions, [Total Amount] )'],answer:1,key:'B',why:'AVERAGEX over distinct customers totals each customer’s spend and then averages those totals. AVERAGE gives the average transaction size.'},
{n:16,d:'M',type:'single',stem:'A business user who doesn’t write DAX needs a measure that returns sales for the Online channel only. Which quick measure should they use?',options:['Running total','Filtered value','Weighted average per category','Star rating'],answer:1,key:'B',why:'The Filtered value quick measure applies a fixed filter, such as Channel = Online, to a base value.'},
{n:17,d:'M',type:'single',stem:'A model has two calculation groups: Time Intelligence and Currency Conversion. Values are converted after the YTD is calculated, but they must be converted first. What should you change?',options:['The calculation group precedence','The order of the calculation items in each group','The format string expressions','The relationship cross-filter direction'],answer:0,key:'A',why:'Precedence decides which calculation group is applied first when several affect the same measure.'},
{n:18,d:'M',type:'single',stem:'Sales[OrderDateTime] (date and time) relates to \'Date\'[Date]. Most sales show under a blank date in visuals. What should you do?',options:['Mark the Date table as a date table.','Create an OrderDate column with only the date part and use it for the relationship.','Set the relationship to Both.','Turn on Auto date/time.'],answer:1,key:'B',why:'Date values are midnight, so date-time values with a time portion don’t match any row. Relating on a date-only column also lowers cardinality.'},
{n:19,d:'V',type:'single',stem:'One chart must compare monthly revenue (in millions) with margin % (between 0 and 1). The small percentages flatten against the revenue scale. Which visual should you use?',options:['Clustered column chart','Line and clustered column chart, with margin % on the secondary y-axis','100% stacked column chart','Pie chart'],answer:1,key:'B',why:'A combo chart with a secondary axis gives each measure its own scale.'},
{n:20,d:'V',type:'single',stem:'You need to change the default font and text size for every visual in one report, quickly. What should you do?',options:['Format each visual.','Use View > Themes > Customize current theme and change the text settings.','Change the Windows display settings.','Use conditional formatting.'],answer:1,key:'B',why:'Customize current theme changes report-wide defaults and can be saved as a JSON theme for reuse.'},
{n:21,d:'V',type:'single',stem:'A table must show a green up arrow next to positive YoY % values and a red down arrow next to negative ones. Which conditional formatting should you use?',options:['Data bars','Icons, with rules based on the value','Background colour, with a gradient','Web URL'],answer:1,key:'B',why:'Icon conditional formatting shows an icon chosen by rules or by a field value.'},
{n:22,d:'V',type:'single',stem:'A report will run on a 1920 × 1080 wall screen and must fill it with no scroll bars. What should you set?',options:['Page size 16:9, with the page view set to Fit to page','Page size Letter','A custom page height of 2000 pixels','Mobile layout'],answer:0,key:'A',why:'A 16:9 page at Fit to page scales to the full screen without scrolling.'},

{n:24,d:'V',type:'single',stem:'A single “Go” button must take users to whichever page they select in a slicer of page names. How should you configure the button?',options:['A Page navigation action, with the destination set by conditional formatting (fx) using a measure that returns the selected page name','One button per page','A bookmark navigator','A drillthrough action'],answer:0,key:'A',why:'Button destinations accept a measure, so one button can navigate to the page chosen in a slicer.'},
{n:25,d:'V',type:'yn',stem:'For each statement about personalizing visuals, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Personalize visuals must be turned on for the report before readers can use it.',a:true},{t:'You can turn personalization off for an individual visual.',a:true},{t:'A reader’s personalized changes are visible to all other readers.',a:false}],key:'Yes, Yes, No',why:'Personalization is enabled per report and can be hidden per visual; changes stay with the reader, who can save them as a personal bookmark.'},
{n:26,d:'V',type:'single',stem:'Colour-blind users can’t tell apart the four lines in a line chart. What is the best fix?',options:['Use brighter colours.','Give each series a different line style (solid, dashed, dotted) and turn on markers or data labels.','Add a legend.','Increase the chart height.'],answer:1,key:'B',why:'Accessible charts don’t rely on colour alone; line styles and markers make series distinguishable without colour.'},
{n:27,d:'V',type:'single',stem:'Report readers must not be able to remove the first level (Region) of a decomposition tree, but they can add other levels. What should you do?',options:['Lock the Region level in the decomposition tree.','Hide the Region column.','Turn off Personalize visuals.','Use a page-level filter on Region.'],answer:0,key:'A',why:'Locking a level in a decomposition tree stops consumers from removing it while still letting them explore further.'},
{n:28,d:'S',type:'single',stem:'While testing a dynamic RLS role in Power BI Desktop, you find that USERNAME() returns DOMAIN\\user, but the Security table stores email addresses. What should you do?',options:['Use USERPRINCIPALNAME() in the role filter.','Store DOMAIN\\user values in the Security table.','Use USEROBJECTID() and store email addresses.','Turn off RLS in Desktop.'],answer:0,key:'A',why:'USERPRINCIPALNAME() returns the sign-in name (usually the email address) in both Desktop and the service.'},
{n:29,d:'S',type:'single',stem:'Ten thin reports connect live to one shared semantic model. Users must see only their own region in every report. Where should you define row-level security?',options:['In each thin report','In the shared semantic model','In the workspace settings','In each report’s Filters pane'],answer:1,key:'B',why:'RLS lives in the semantic model and applies to every report connected to it. Thin live-connected reports can’t define roles.'},
{n:30,d:'S',type:'single',stem:'Requests for access to items in a workspace should go to a support group, not to the workspace admins. What should you configure?',options:['The workspace contact list','The app audience','Row-level security','Endorsement'],answer:0,key:'A',why:'The workspace contact list sets who receives notifications and access requests for the workspace.'},
{n:31,d:'S',type:'single',stem:'Every new Power BI report must have a sensitivity label before it can be saved or published. What should a Microsoft Purview admin configure?',options:['A label policy with mandatory labelling for Power BI content','Row-level security','Certification','Workspace contact lists'],answer:0,key:'A',why:'Mandatory labelling in a label policy requires users to apply a label to Power BI content.'},
{n:32,d:'P',type:'goal',stem:'Solution: Use Change Type > Using Locale for both columns, choosing Date and Decimal number with the locale German (Germany). Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'Using Locale stores the locale in the step, so values parse the same way on every computer.'},
{n:33,d:'P',type:'goal',stem:'Solution: Change the column types to Date and Decimal number with the standard Change Type command. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'A plain type change uses the current locale, so results depend on the regional settings of whoever refreshes.'},
{n:34,d:'P',type:'goal',stem:'Solution: In Options, under Current File > Regional Settings, set the locale for import to German (Germany), then change the column types. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'The current file’s locale is saved in the .pbix, so every refresh parses the values with the German locale. It affects all queries in the file.'},
{n:35,d:'S',type:'single',stem:'How should you configure security for relationship managers?',options:['A role with the filter Security[ManagerEmail] = USERPRINCIPALNAME() on the Security table, with the Security–Customer relationship set to Both and Apply security filter in both directions selected','One static role per manager','Add each manager to the workspace as a Member','A page filter on ManagerEmail'],answer:0,key:'A',why:'The filter on the Security table must flow to Customer, which is on the one side, so the relationship needs Both with the security filter applied in both directions. New rows in Security need no role changes.'},
{n:36,d:'S',type:'single',stem:'How should you meet the compliance officers’ requirement?',options:['Make them workspace Members.','Make them workspace Viewers and add their security group to a role whose filter returns all rows (for example, TRUE()).','Make them workspace Contributors.','Remove RLS from the model.'],answer:1,key:'B',why:'Viewers are subject to RLS, so they need a role that shows everything. Members and Contributors would see all data but could also edit content.'},
{n:37,d:'M',type:'blanks',stem:'Balances are recorded every day. Complete the measure for the closing-balance card.',code:`Closing Balance = [Blank 1] ( SUM ( Balances[Amount] ), 'Date'[Date] )`,blanks:[{options:['CLOSINGBALANCEMONTH','OPENINGBALANCEMONTH','TOTALMTD'],a:0}],key:'CLOSINGBALANCEMONTH',why:'CLOSINGBALANCEMONTH evaluates the expression on the last date of the month, which suits semi-additive balances. TOTALMTD would add up the daily balances.'},

{n:16,d:'M',type:'single',code:true,stem:'In a table visual of products filtered by category, products with no sales must show 0 instead of disappearing. Which measure should you use?',options:['Sales Display = [Sales] + 0','Sales Display = FORMAT ( [Sales], "0" )','Sales Display = SUM ( Sales[Amount] )','Sales Display = BLANK ()'],answer:0,key:'A',why:'Adding 0 turns blank into 0, so every product in the current filter appears. FORMAT returns text and loses numeric behaviour.'},

{n:18,d:'M',type:'single',stem:'Several relationships in a model are set to Both, and visuals have become slow and sometimes ambiguous. Only one measure needs filtering from Sales to Customer. What should you do?',options:['Set the relationships to single direction, and use CROSSFILTER ( …, BOTH ) inside that one measure.','Set every relationship to Both.','Delete the Customer table.','Turn on Auto date/time.'],answer:0,key:'A',why:'Bidirectional filters cost performance and can create ambiguity. CROSSFILTER limits the change to the measure that needs it.'},

{n:20,d:'V',type:'single',stem:'A matrix with Region > Country rows must show subtotals for Region but not for each Country. What should you configure?',options:['Row subtotals > Per row level, with Country subtotals turned off','Turn off all row subtotals','Turn on Stepped layout','Use a table visual'],answer:0,key:'A',why:'Per-level subtotal settings control subtotals for each row level separately.'},

{n:24,d:'V',type:'single',stem:'One button must drill through to either Customer Details or Order Details, depending on a choice the user makes in a slicer. How should you configure it?',options:['A Drill through action, with the destination set by conditional formatting (fx) using a measure that returns the selected page name','Two overlapping buttons','A page navigator','A bookmark'],answer:0,key:'A',why:'Drillthrough button destinations can be set from a measure.'},
{n:25,d:'V',type:'yn',stem:'For each statement about exporting data, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Report authors can let readers export a report to PDF or PowerPoint from the service.',a:true},{t:'Tenant admins can restrict export options in ways a report’s settings can’t override.',a:true},{t:'Data exported to Excel ignores row-level security.',a:false}],key:'Yes, Yes, No',why:'Export respects RLS, and tenant settings take priority over report settings.'},

{n:27,d:'V',type:'single',stem:'Anomaly detection on a daily line chart flags too many points as anomalies. What should you change?',options:['Lower the sensitivity in the anomaly detection settings.','Turn on forecasting.','Add a trend line.','Use a clustered column chart.'],answer:0,key:'A',why:'The sensitivity setting controls how far a value must deviate before it’s flagged.'},

{n:30,d:'S',type:'single',stem:'After publishing, you want to confirm that a role filters correctly for a specific colleague. Where can you test it in the service?',options:['In the semantic model’s Security settings, use Test as role and choose the colleague.','In the app settings','In the workspace contact list','In the report’s Filters pane'],answer:0,key:'A',why:'Test as role shows the report as a role, or as a specific person, would see it.'},
{n:31,d:'S',type:'single',stem:'When a data alert fires on a dashboard tile, a message must also be posted to a Teams channel. What should you do?',options:['Create a Power Automate flow triggered by the data alert.','Subscribe the channel to the report.','Pin the tile to Teams.','Use Publish to web.'],answer:0,key:'A',why:'Data alerts email only their owner, but they can trigger Power Automate flows that post to Teams or elsewhere.'},
{n:32,d:'S',type:'goal',stem:'Solution: Install a second standard mode gateway on another server, and add it to the same gateway cluster as the first. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'Gateway clusters give high availability: if one member is offline, requests go to another member.'},

{n:35,d:'P',type:'single',stem:'How should you meet the Direct Lake requirement?',options:['Replace the views with Delta tables in the lakehouse (for example, materialised by a notebook or pipeline), and point the model at those tables.','Switch the model to Import.','Add more views.','Turn on Auto date/time.'],answer:0,key:'A',why:'Direct Lake reads only Delta tables. Views force DirectQuery fallback.'},

{n:37,d:'M',type:'single',code:true,stem:'[Stock] = SUM ( Stock[Qty] ). Which measure meets the stock card requirement?',options:["SUMX ( VALUES ( Warehouse[WarehouseID] ), CALCULATE ( [Stock], LASTNONBLANK ( 'Date'[Date], [Stock] ) ) )","CALCULATE ( [Stock], LASTNONBLANK ( 'Date'[Date], [Stock] ) )","CALCULATE ( [Stock], LASTDATE ( 'Date'[Date] ) )","SUM ( Stock[Qty] )"],answer:0,key:'A',why:'Each warehouse’s last count date differs, so you find it per warehouse and then add the results. A single LASTNONBLANK uses the last date on which any warehouse counted.'},

SOURCES.push((function(){
const EXAM = {num:10, shuffle:true, caseTitle:'Lamna Healthcare', next:null};

const LH_SVG = flowSVG('lha', 'Lamna Healthcare: patient data on-premises, labs in Azure', [
  ['Patient administration', 'SQL Server, on-premises', 'Admissions: 30 million rows'],

  ['Staff roster', 'Excel in SharePoint Online', 'Shift text such as 07:00-19:00'],
  ['Employee hierarchy', 'Table with a Path column', 'Ward manager up to chief']
], ['Power BI workspace', 'Fabric F64 capacity', 'Semantic model + reports'], [
  ['Ward managers', 'Own ward only'],
  ['Hospital directors', 'All wards in their hospital'],
  ['Executives', 'Readmission summary, group view']
]);

const GOAL = 'Data exported from the Readmissions report to Excel, PowerPoint or PDF must stay protected (encrypted) after it leaves Power BI.';

const CASE = `<p><b>Overview.</b> Lamna Healthcare runs six hospitals. Its Power BI workspace runs on a Fabric F64 capacity.</p>
${LH_SVG}
<h3>Existing environment</h3><ul>
<li>Admissions come from a patient administration system on SQL Server in the company data centre. Each admission has a length of stay (LOS) in days; day-case admissions have an LOS of 0.</li>
<li>Laboratory results are in an Azure SQL Database with public access.</li>
<li>The staff roster is an Excel workbook in SharePoint Online. Shifts are stored as text, such as 07:00-19:00.</li>
<li>An Employee table has EmployeeID, Email and Path columns. Path is built with PATH() and lists every manager above an employee.</li></ul>
<h3>Requirements</h3><ul>
<li>Every manager must see the data of their own staff and of everyone below them in the hierarchy.</li>
<li>Admissions must refresh nightly.</li>
<li>Average length of stay must exclude day cases.</li>
<li>Shift start and end must be loaded as separate time values.</li>
<li>Executives want an AI-written summary of the readmissions page that focuses on readmission risk.</li>
<li>Executives must compare each hospital’s readmission rate with the group average on one chart.</li></ul>`;

const Q = [
{n:1,d:'P',type:'single',stem:'A query calls a REST API with the code in the exhibit. It refreshes in Desktop, but in the service it fails because the query uses a dynamic data source. What should you change?',exhibit:`<pre class="code">Source = Json.Document ( Web.Contents ( "https://api.example.com/v2/admissions?ward=" &amp; WardCode ) )</pre>`,options:['Use a static base URL and move the variable part into the RelativePath and Query options of Web.Contents.','Install a personal gateway.','Set the privacy level to Public.','Turn off Include in report refresh.'],answer:0,key:'A',why:'The service must know the data source before running the query. A fixed base URL with RelativePath and Query options makes the source static.'},
{n:2,d:'P',type:'single',stem:'You built a query that cleans one monthly file. You need the same steps applied to every file in a list of files. What should you do?',options:['Turn the cleaning query into a function (Create Function) and use Invoke Custom Function on the file list.','Duplicate the query once per file.','Append the file list to itself.','Create a What-if parameter.'],answer:0,key:'A',why:'A function holds the steps once and applies them to each file, which is what Combine files does behind the scenes.'},
{n:3,d:'P',type:'yn',stem:'A composite model has an imported Ward table and a DirectQuery Admissions table from SQL Server. For each statement, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A relationship between tables in different source groups is a limited relationship.',a:true},{t:'Limited relationships add a blank row for fact rows whose key has no match in the dimension.',a:false},{t:'Setting Ward to Dual storage mode lets its relationship with the DirectQuery table behave as a regular relationship.',a:true}],key:'Yes, No, Yes',why:'Cross-source-group relationships are limited and don’t add blank rows. A Dual table belongs to the DirectQuery source group too, so its relationship with the DirectQuery table is regular.'},
{n:4,d:'P',type:'single',stem:'Overlapping daily extracts have created exact duplicate rows in an Admissions query: every column is identical. What should you do?',options:['Select all columns, then Remove Duplicates.','Remove Duplicates on AdmissionID only.','Group By AdmissionID with Sum.','Keep Errors.'],answer:0,key:'A',why:'When rows are identical in every column, removing duplicates across all columns removes only true copies. (Removing duplicates on AdmissionID gives the same result here, but it would also hide real changes if the copies differed.)'},
{n:5,d:'P',type:'single',stem:'A column holds text such as “01:30:00”, meaning 1 hour 30 minutes of procedure time. You need to sum and average it. Which data type should you choose?',options:['Duration','Time','Date/Time','Text'],answer:0,key:'A',why:'Duration stores a length of time that can be added up. Time stores a time of day.'},
{n:6,d:'P',type:'blanks',stem:'Ward codes arrive as text of different lengths, such as “42” and “1305”. Complete the custom column so every code has six characters, padded with leading zeros (“000042”).',code:`= Table.AddColumn ( Source, "WardCode6", each [Blank 1] ( [WardCode], 6, "0" ) )`,blanks:[{options:['Text.PadStart','Text.PadEnd','Text.Start'],a:0}],key:'Text.PadStart',why:'Text.PadStart adds the pad character at the beginning until the text reaches the given length.'},
{n:7,d:'P',type:'seq',steps:4,stem:'One CSV file per month lands in a folder that also contains other files. You need to combine only the CSV files. Which four actions should you perform in sequence?',options:['Connect with the Folder connector and select Transform Data.','Filter the Extension column to .csv.','Select Combine Files on the Content column.','Adjust the steps in the Transform Sample File query if needed.','Append the queries into one.'],answers:[[0,1,2,3]],key:'A, B, C, D',why:'Filter the file list before combining so other files are skipped. Combine Files then builds a sample-file query that you can adjust for every file.'},
{n:8,d:'P',type:'single',stem:'You fuzzy-merge hospital names, but common abbreviations such as “St” and “Saint” still don’t match. What should you add to the fuzzy matching options?',options:['A transformation table that maps “St” to “Saint”','A lower similarity threshold of 0','A Full outer join','A conditional column'],answer:0,key:'A',why:'A transformation table (From and To columns) tells fuzzy matching which values to treat as equivalent before scoring similarity.'},
{n:9,d:'P',type:'single',stem:'An incremental refresh policy should never load today’s incomplete data. Which option should you select?',options:['Only refresh complete days','Detect data changes','Get the latest data in real time with DirectQuery','Archive data starting 5 years before refresh date'],answer:0,key:'A',why:'Only refresh complete days excludes the current, partial day from the refresh window.'},
{n:10,d:'M',type:'single',stem:'A Ward table has a PhotoUrl column with links to ward photos. A table visual must show the images rather than the links. What should you do?',options:['Set the PhotoUrl column’s data category to Image URL.','Set the data category to Web URL.','Change the type to Binary.','Use conditional formatting with icons.'],answer:0,key:'A',why:'Table and matrix visuals render columns categorised as Image URL as images.'},
{n:11,d:'M',type:'single',stem:'Admissions and LabResults are both fact tables that relate to Patient and Date. A report needs lab results by the ward of the admission. Following star schema guidance, how should the two fact tables be connected?',options:['Through the shared dimension tables (Patient, Date, and Ward if needed), not directly to each other','With a direct many-to-many relationship between Admissions and LabResults','By merging LabResults into Admissions','With a bidirectional relationship between the two facts'],answer:0,key:'A',why:'Facts should be connected through conformed dimensions. Fact-to-fact relationships cause ambiguity and many-to-many complexity.'},
{n:12,d:'M',type:'yn',stem:'For each statement about calculated columns, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Calculated columns take up memory in the model, like imported columns.',a:true},{t:'A calculated column can reference a measure, which is then evaluated for each row with context transition.',a:true},{t:'Calculated columns are recalculated each time a visual is rendered.',a:false}],key:'Yes, Yes, No',why:'Calculated columns are computed at refresh and stored. A measure referenced inside one is evaluated for each row.'},
{n:13,d:'M',type:'blanks',stem:'A Beds measure must show a value only when exactly one ward is in context, and blank on totals. Complete the measure.',code:`Beds Shown = IF ( [Blank 1] ( Ward[WardName] ), [Beds], BLANK () )`,blanks:[{options:['HASONEVALUE','ISBLANK','VALUES'],a:0}],key:'HASONEVALUE',why:'HASONEVALUE returns TRUE when the filter context contains exactly one value of the column.'},
{n:14,d:'M',type:'blanks',stem:'Complete the measure so it returns the seven-day moving average of daily admissions.',code:`Admissions 7D Avg =
[Blank 1] (
    DATESINPERIOD ( 'Date'[Date], MAX ( 'Date'[Date] ), -7, [Blank 2] ),

{n:15,d:'M',type:'single',stem:'Analysts studied the length of stay in a sample of 12 wards and want the standard deviation as an estimate for all wards. Which function should they use?',options:['STDEV.S','STDEV.P','VAR.P','MEDIAN'],answer:0,key:'A',why:'STDEV.S is for a sample used to estimate a wider population. STDEV.P is for a complete population.'},
{n:16,d:'M',type:'single',code:true,stem:'You need the number of patients who had at least one admission in the selected period. Admissions has one row per admission and a PatientID column. Which measure should you use?',options:['DISTINCTCOUNT ( Admissions[PatientID] )','COUNTROWS ( Patient )','COUNT ( Admissions[PatientID] )','COUNTROWS ( Admissions )'],answer:0,key:'A',why:'A distinct count of PatientID on the fact table counts each admitted patient once. COUNTROWS ( Patient ) counts every patient, admitted or not.'},
{n:17,d:'M',type:'single',stem:'A Cost measure should show 950 as “950”, 12,400 as “12.4K” and 3,200,000 as “3.2M”, while staying numeric for sorting. What should you use?',options:['A dynamic format string on the measure','FORMAT inside the measure','A calculated column of text','Conditional formatting'],answer:0,key:'A',why:'Dynamic format strings change the display based on the value and keep the measure numeric. FORMAT returns text.'},
{n:18,d:'M',type:'single',stem:'A LabResults table includes cancelled tests, which make up 40% of its rows and are never reported. What should you do?',options:['Filter out the cancelled tests in Power Query, so the filter folds to the source.','Hide the cancelled rows with a report-level filter.','Add a calculated column that flags cancelled tests.','Set the table to Dual.'],answer:0,key:'A',why:'Removing rows nobody needs before loading cuts model size and refresh time. A report filter still loads them.'},
{n:19,d:'V',type:'single',stem:'Managers want to see bed occupancy for each ward by hour of the day, and spot busy periods at a glance. Which approach should you use?',options:['A matrix with wards on rows and hours on columns, with gradient background colour on the values (a heat map)','A pie chart for each ward','A funnel chart','A KPI visual'],answer:0,key:'A',why:'Colour-scaled matrix cells make patterns across two dimensions easy to see.'},
{n:20,d:'V',type:'single',stem:'One slicer must let users pick a region, a hospital within it, or a ward within that hospital. What should you do?',options:['Add Region, Hospital and Ward to the same slicer as a hierarchy.','Add three slicers with sync slicers.','Use a Top N filter.','Use a relative date slicer.'],answer:0,key:'A',why:'A slicer with several fields becomes an expandable hierarchy slicer.'},
{n:21,d:'V',type:'single',stem:'A matrix shows the difference from target. Cells must be red below 0, white at 0 and green above 0. What should you configure?',options:['Gradient background colour, with a middle colour (white) at 0','Rules with one rule','Data bars','Field value'],answer:0,key:'A',why:'Adding a middle colour to a gradient creates a diverging scale centred on the value you choose.'},
{n:22,d:'V',type:'single',stem:'You have six bookmarks. Three tell a story about readmissions and three about bed capacity. Users should switch between the bookmarks in each story with a row of buttons. What should you do?',options:['Group the bookmarks into two bookmark groups and add a bookmark navigator for each group.','Add six blank buttons.','Use a page navigator.','Use drillthrough.'],answer:0,key:'A',why:'A bookmark navigator creates buttons for the bookmarks in a group and updates when bookmarks change.'},
{n:23,d:'V',type:'single',stem:'Daily admissions follow a weekly pattern, but the forecast on a line chart ignores it. Which forecast setting should you change?',options:['Seasonality, set to 7 points','Forecast length','Ignore the last','Confidence interval'],answer:0,key:'A',why:'Seasonality tells the forecast the length of the repeating cycle: seven daily points per week.'},
{n:24,d:'V',type:'single',stem:'Ward clerks must choose a hospital when they open a report, then print a fixed 40-page pack for it. What should you build?',options:['A paginated report with a Hospital report parameter','A Power BI report with a slicer, exported to PDF','A dashboard','A tooltip page'],answer:0,key:'A',why:'Paginated reports support run-time parameters and produce fixed-layout, multi-page output for printing.'},
{n:25,d:'V',type:'single',stem:'When users drill down from Hospital to Ward in a bar chart, the other visuals on the page must also filter to the drilled hospital. What should you turn on?',options:['Drilling filters other visuals (under Edit interactions on the Format tab)','Keep all filters','Sync slicers','Personalize visuals'],answer:0,key:'A',why:'By default, drilling affects only the visual you drill in. This option makes the drill level filter the other visuals.'},
{n:26,d:'V',type:'single',stem:'A report page has decorative shapes that keyboard users have to tab through before reaching the charts. What should you do?',options:['In the Selection pane, on the Tab order tab, hide the decorative shapes from the tab order and arrange the visuals logically.','Delete the shapes.','Add alt text to the shapes.','Lock objects.'],answer:0,key:'A',why:'Tab order controls which items keyboard focus visits, and in what sequence. Decorative items can be removed from it.'},
{n:27,d:'V',type:'single',stem:'Automatic clustering on a scatter chart of wards (LOS against readmission rate) creates four clusters, but the analysis needs exactly three. What should you do?',options:['Edit the cluster and set the number of clusters to 3.','Create bins of size 3.','Use a Top N filter of 3.','Add a third axis.'],answer:0,key:'A',why:'The clustering dialog lets you set the number of clusters instead of choosing automatically.'},
{n:28,d:'S',type:'single',stem:'Clinical analysts report that they can’t create workspaces. What is the most likely cause?',options:['The Fabric admin has limited the Create workspaces tenant setting to specific groups.','They don’t have Build permission.','Their reports have no sensitivity label.','The gateway is offline.'],answer:0,key:'A',why:'Who can create workspaces is controlled by a tenant setting.'},
{n:29,d:'S',type:'yn',stem:'For each statement about Power BI apps, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'One app can have several audiences, each seeing different content.',a:true},{t:'Changes to a report in the workspace appear in the app only after the app is updated.',a:true},{t:'App users must have a role in the workspace.',a:false}],key:'Yes, Yes, No',why:'Apps are published copies with audiences, and app users don’t need workspace access.'},
{n:30,d:'S',type:'single',stem:'Forty analysts in a security group must be able to build their own reports on a semantic model, but must not share the model with anyone else. What should you do?',options:['In Manage permissions for the semantic model, grant the group Build permission without Reshare.','Make the group Members of the workspace.','Share the report with the group and allow resharing.','Publish the report to the web.'],answer:0,key:'A',why:'Build permission enables report creation on the model. Leaving Reshare off stops the analysts sharing it further.'},

{n:32,d:'S',type:'goal',stem:'Solution: Apply a sensitivity label that is configured with encryption (protection settings) to the report and its semantic model. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'Labels with protection settings are carried into supported exports, so the exported files remain encrypted.'},
{n:33,d:'S',type:'goal',stem:'Solution: Apply a sensitivity label that only adds a classification and has no protection settings. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'A label without protection marks the content but doesn’t encrypt exported files.'},
{n:34,d:'S',type:'goal',stem:'Solution: Configure row-level security on the semantic model. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'RLS limits which rows users can see in Power BI, but it doesn’t protect files after they are exported.'},

{n:36,d:'S',type:'single',stem:'Which source requires an on-premises data gateway?',options:['The patient administration database on SQL Server','The laboratory Azure SQL Database','The staff roster in SharePoint Online','All three'],answer:0,key:'A',why:'Only the on-premises SQL Server needs a gateway. Azure SQL with public access and SharePoint Online are cloud sources.'},
{n:37,d:'M',type:'single',code:true,stem:'Which measure meets the average length of stay requirement?',options:['CALCULATE ( AVERAGE ( Admissions[LOS] ), Admissions[LOS] > 0 )','AVERAGE ( Admissions[LOS] )','DIVIDE ( SUM ( Admissions[LOS] ), COUNTROWS ( Admissions ) )','AVERAGEX ( Admissions, Admissions[LOS] + 0 )'],answer:0,key:'A',why:'Filtering out LOS = 0 rows excludes day cases from the average. The other options still include them.'},

{n:1,d:'P',type:'single',stem:'You need data from a Microsoft Dataverse table that a Power Apps solution uses. Which connector should you use?',options:['Dataverse','ODBC','Folder','Web'],answer:0,key:'A',why:'The Dataverse connector reads Dataverse tables directly and supports both Import and DirectQuery.'},
{n:2,d:'P',type:'single',stem:'A supplier sends price lists as PDF files that contain tables. How can you load those tables in Power Query?',options:['Use the PDF connector and select the tables it detects.','Convert the files to images first.','Use the Web connector.','You can’t; PDF files aren’t supported.'],answer:0,key:'A',why:'The PDF connector detects tables (and pages) in a PDF file so you can load and transform them.'},
{n:3,d:'P',type:'single',stem:'You need the items of a SharePoint Online list. Which connector should you use?',options:['SharePoint Online list, with the site address','SharePoint folder','Excel workbook','OData feed with anonymous access'],answer:0,key:'A',why:'Lists use the SharePoint Online list connector. The SharePoint folder connector reads files in document libraries.'},
{n:4,d:'P',type:'single',stem:'You typed a SQL statement in the SQL Server connector’s advanced options. Filters you add afterwards in Power Query are slow, because they aren’t sent to the server. What should you do?',options:['Put the filtering into the SQL statement, or call it with Value.NativeQuery and EnableFolding set to true.','Change the privacy level to Public.','Turn off Auto date/time.','Add an index column before the filter.'],answer:0,key:'A',why:'Steps after a native query usually can’t fold. Filtering inside the SQL statement, or enabling folding on Value.NativeQuery, pushes the work back to the server.'},
{n:5,d:'P',type:'single',stem:'With a SQL Server source, which step most often stops query folding for the steps that follow it?',options:['Add Index Column','Filter Rows','Remove Columns','Rename Columns'],answer:0,key:'A',why:'Filtering, removing and renaming columns translate into SQL. An index column usually can’t, so later steps run in Power Query instead.'},
{n:6,d:'P',type:'single',stem:'A semantic model refreshes from an on-premises SQL Server through a gateway, using Windows authentication. The service account’s password changed, and refresh now fails. Where do you update it?',options:['In the gateway connection’s settings, under Manage connections and gateways','In the semantic model’s credentials for cloud data sources','In Power BI Desktop, then republish','In the workspace settings'],answer:0,key:'A',why:'For gateway sources, credentials are stored on the gateway connection, not in the report file.'},
{n:7,d:'P',type:'single',stem:'An HR source may be combined with other internal sources, but its data must never be sent to public sources. Which privacy level should you set?',options:['Organizational','Private','Public','None'],answer:0,key:'A',why:'Organizational data can flow to other Organizational sources but not to Public ones. Private would also block combining it with internal sources.'},
{n:8,d:'P',type:'single',stem:'A DirectQuery table shows the error: “This step results in a query that is not supported in DirectQuery mode.” What is the cause?',options:['A Power Query step can’t be translated (folded) into a query for the source.','The table is too large.','Auto date/time is turned on.','The privacy level is Private.'],answer:0,key:'A',why:'In DirectQuery, every transformation must fold. Move the logic into a source view, simplify the step, or switch the table to Import.'},
{n:9,d:'P',type:'single',stem:'A 2.5 GB Import model fails to publish to a workspace that uses the Pro licence mode. Why?',options:['Pro workspaces limit each semantic model to 1 GB.','Pro workspaces don’t allow Import models.','The model needs a gateway.','The file must be under 100 MB.'],answer:0,key:'A',why:'Shared (Pro) capacity allows 1 GB per semantic model. Reduce the model, or move it to Premium Per User or a Fabric capacity.'},
{n:10,d:'P',type:'single',stem:'Customer IDs should all be eight characters long. While profiling, how can you quickly spot IDs with the wrong length?',options:['In the column profile, group the value distribution by text length.','Turn on Column quality.','Sort the column in descending order.','Use Fill Down.'],answer:0,key:'A',why:'The column profile’s value distribution can be grouped, for example by text length, which shows unusual values at a glance.'},
{n:11,d:'P',type:'single',stem:'You need to replace the value “NA” with null, but text such as “NATO” must stay unchanged. What should you do?',options:['Use Replace Values with Match entire cell contents selected.','Use Replace Values with the default options.','Use Trim.','Use Split Column.'],answer:0,key:'A',why:'Match entire cell contents replaces only cells whose whole value is “NA”. By default, Replace Values also changes matching text inside longer values.'},
{n:12,d:'P',type:'single',stem:'Before fixing date conversion errors, you want to look at only the rows that fail, without changing the main query. What should you do?',options:['Reference the query, then use Keep Errors in the new query.','Use Remove Errors in the main query.','Change the column type to Text.','Disable load for the main query.'],answer:0,key:'A',why:'Keep Errors in a referencing query isolates the failing rows for inspection, and the original query stays intact.'},
{n:13,d:'P',type:'single',stem:'Timestamps are stored in UTC, and reports must show Brussels time. A To Local Time step works in Power BI Desktop, but after scheduled refresh in the service the times show UTC. Why?',options:['To Local Time uses the time zone of the machine that runs the refresh, which is UTC in the service.','The gateway is misconfigured.','Date/time columns can’t be refreshed.','Privacy levels block the conversion.'],answer:0,key:'A',why:'Convert with an explicit offset instead, for example with DateTimeZone.SwitchZone, and handle daylight saving time deliberately.'},
{n:14,d:'P',type:'blanks',stem:'Complete the custom column so orders above 100 units are labelled Bulk and all others Standard.',code:`= Table.AddColumn ( Source, "OrderSize", each if [Quantity] > 100 then "Bulk" [Blank 1] "Standard" )`,blanks:[{options:['else','elseif','otherwise'],a:0}],key:'else',why:'M conditionals are written if … then … else …. There is no elseif keyword; nested conditions use else if.'},
{n:15,d:'P',type:'blanks',stem:'Complete the step so it keeps rows whose ProductName contains “pro” in any capitalisation.',code:`= Table.SelectRows ( Source, each Text.Contains ( [ProductName], "pro", [Blank 1] ) )`,blanks:[{options:['Comparer.OrdinalIgnoreCase','Comparer.Ordinal','Text.Lower'],a:0}],key:'Comparer.OrdinalIgnoreCase',why:'Text.Contains is case-sensitive by default. The Comparer.OrdinalIgnoreCase comparer makes it ignore case.'},
{n:16,d:'P',type:'single',stem:'You need the median order value per customer, calculated in Power Query. What should you use?',options:['Group By (Advanced), grouping by CustomerID with the Median operation on OrderValue','Pivot Column on CustomerID','Merge Queries','Add Index Column'],answer:0,key:'A',why:'Group By offers Median among its operations, alongside Sum, Average, Min, Max and Count.'},
{n:17,d:'P',type:'single',stem:'A table has one row per order, with CustomerID and a Status column (Open, Shipped or Cancelled). You need one row per customer, with a column counting the orders in each status. What should you do?',options:['Pivot the Status column, with OrderID as the values column and the Count (All) aggregation.','Unpivot the Status column.','Transpose the table.','Group By Status only.'],answer:0,key:'A',why:'Pivoting Status turns each status into a column, and the Count aggregation counts the orders that fall into each cell.'},
{n:18,d:'P',type:'single',stem:'An XML file has Order elements, each containing nested Line elements. After you connect, the Line data appears as a Table column. How do you get one row per line?',options:['Expand the nested Table column.','Transpose the table.','Use Extract Values.','Change the column type to Text.'],answer:0,key:'A',why:'Nested XML elements arrive as table columns; expanding them produces one row per child element.'},
{n:19,d:'P',type:'single',stem:'An Excel workbook has 12 sheets, one per month, with identical columns. You need all rows in one table, including sheets added later. What should you do?',options:['Start from the workbook’s list of sheets, filter it to the sheets you need, and expand the Data column.','Import each sheet and merge them.','Use the Folder connector.','Transpose each sheet.'],answer:0,key:'A',why:'Working from the list of sheets (Excel.Workbook) lets one query expand them all, so new sheets are picked up automatically.'},
{n:20,d:'P',type:'multi',pick:2,stem:'A flat sales extract has OrderID, OrderDate, CustomerID, CustomerName, CustomerSegment, Quantity and SalesAmount. Which two columns should move to the Customer dimension?',options:['CustomerName','CustomerSegment','Quantity','SalesAmount','OrderDate'],answer:[0,1],key:'A, B',why:'Descriptive attributes of the customer belong in the dimension. CustomerID stays in both tables as the key.'},
{n:21,d:'P',type:'single',stem:'You want to try a different set of steps on a query without affecting the original or any queries that reference it. What should you do?',options:['Duplicate the query.','Reference the query.','Disable load for the query.','Rename the query.'],answer:0,key:'A',why:'A duplicate is an independent copy, so changing it doesn’t affect the original or the queries that depend on it.'},
{n:22,d:'P',type:'single',stem:'The Customers query references Sales and uses its CustomerCity column. You remove CustomerCity from Sales. What happens to Customers?',options:['It fails with a missing-column error, because it starts from the output of Sales.','Nothing; a reference copies the data when it’s created.','It switches to the original source automatically.','Power Query restores the column.'],answer:0,key:'A',why:'A reference always starts from the latest output of the referenced query, so removing a column it relies on breaks it.'},
{n:23,d:'P',type:'single',stem:'You need to compare two product lists in one result that shows products found only in the first list, only in the second, or in both. Which join kind should you use?',options:['Full outer','Inner','Left anti','Right outer'],answer:0,key:'A',why:'A full outer join keeps every row from both tables, with nulls where there is no match.'},
{n:24,d:'P',type:'single',stem:'A merge must keep only the orders that have a matching customer record and drop all others. Which join kind should you use?',options:['Inner','Left outer','Full outer','Right anti'],answer:0,key:'A',why:'An inner join returns only rows that match in both tables.'},
{n:25,d:'P',type:'single',stem:'After you expand a merged Product column, the new columns are named Product.Category and Product.Brand, but you want Category and Brand. What should you change when expanding?',options:['Clear Use original column name as prefix.','Choose Aggregate instead of Expand.','Rename the merged query.','Transpose the table.'],answer:0,key:'A',why:'Clearing the prefix option keeps the original column names.'},
{n:26,d:'P',type:'blanks',stem:'Complete the step so it appends Sales2025 and Sales2026.',code:`= [Blank 1] ( { Sales2025, Sales2026 } )`,blanks:[{options:['Table.Combine','Table.Join','Table.NestedJoin'],a:0}],key:'Table.Combine',why:'Table.Combine appends a list of tables. Table.Join and Table.NestedJoin perform merges.'},
{n:27,d:'P',type:'single',stem:'You build a key by concatenating StoreID and ProductID. Store 1 with product 23 and store 12 with product 3 both produce “123”. What should you do?',options:['Put a delimiter between the values, such as “1-23” and “12-3”.','Use a many-to-many relationship.','Remove duplicates on the key.','Sort the table first.'],answer:0,key:'A',why:'A delimiter keeps the parts distinct, so different combinations can’t produce the same key.'},
{n:28,d:'P',type:'single',stem:'The Power Query Editor feels slow because it keeps downloading previews for every query. Which option reduces this?',options:['Turn off Allow data preview to download in the background.','Turn off Auto date/time.','Set every privacy level to Public.','Disable load for every query.'],answer:0,key:'A',why:'Background preview downloads refresh every query’s preview. Turning them off loads previews only when you open a query.'},
{n:29,d:'P',type:'single',stem:'In Power BI Desktop, you only need to refresh one large table after changing its query. What should you do?',options:['Right-click the table in the Data pane and select Refresh data.','Select Refresh on the Home tab.','Close and reopen the file.','Republish the report.'],answer:0,key:'A',why:'Refreshing a single table reloads only that table. Refresh on the Home tab reloads every table.'},
{n:30,d:'P',type:'yn',stem:'For each statement about incremental refresh, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Incremental refresh works best when the RangeStart and RangeEnd filter folds to the source.',a:true},{t:'The partitions defined by the policy are created in the service when the model is first refreshed after publishing.',a:true},{t:'Incremental refresh can be used only with DirectQuery tables.',a:false}],key:'Yes, Yes, No',why:'Incremental refresh partitions Import tables in the service; folding lets each partition query only its own rows.'},
{n:31,d:'P',type:'single',stem:'Sales is a large DirectQuery table. A small exchange-rate table in Excel changes monthly and must relate to Sales. What is a sensible design?',options:['Import the exchange-rate table, creating a composite model.','Use DirectQuery for the Excel file.','Put both tables on a dashboard.','Merge the two tables in Power Query before loading.'],answer:0,key:'A',why:'Excel files can’t use DirectQuery, but a composite model can import the small table and relate it to the DirectQuery table.'},
{n:32,d:'P',type:'yn',stem:'For each statement about Direct Lake, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A Direct Lake refresh copies all table data into the semantic model.',a:false},{t:'Direct Lake models read Delta tables stored in OneLake.',a:true},{t:'Direct Lake needs a Fabric (or Premium) capacity.',a:true}],key:'No, Yes, Yes',why:'A Direct Lake refresh (framing) only updates metadata to point at the latest Delta files; data is loaded into memory on demand.'},

{n:33,d:'M',type:'single',stem:'Can you switch an existing Import table to DirectQuery in Power BI Desktop?',options:['No. You can change DirectQuery to Import or Dual, but not Import to DirectQuery.','Yes, with the table’s storage mode property.','Only for tables under 1 GB.','Only if Auto date/time is turned off.'],answer:0,key:'A',why:'Switching from Import to DirectQuery isn’t supported. Recreate the table in DirectQuery mode instead.'},
{n:34,d:'M',type:'single',stem:'A Temperature column should show the average, not the sum, when users drag it onto a visual. What should you set?',options:['The column’s Summarize by property, to Average','Its data category','Its format, to Decimal','Its Sort by column property'],answer:0,key:'A',why:'Summarize by sets the default aggregation for implicit measures.'},
{n:35,d:'M',type:'single',stem:'You try to sort Month Name by the Date column and get an error. Why?',options:['Each Month Name value maps to many dates; the sort column must have one value for each value of the sorted column.','Date columns can’t be used for sorting.','Month Name must be hidden first.','The table isn’t marked as a date table.'],answer:0,key:'A',why:'Sort by column needs a single sort value per value, such as Month Name sorted by MonthNumber.'},
{n:36,d:'M',type:'single',stem:'Sales has SalespersonID and ManagerID, which both refer to employees. Users must slice by salesperson and by manager at the same time. What should you do?',options:['Create a second employee table (for example, a Manager query that references Employee) and relate each role to its own table.','Use one Employee table with two active relationships.','Merge Employee into Sales twice.','Use a many-to-many relationship.'],answer:0,key:'A',why:'Slicing by both roles at once needs two active filter paths, so each role gets its own dimension table.'},
{n:37,d:'M',type:'single',stem:'Power BI won’t create a one-to-many relationship from Products[ProductCode] to Orders[ProductCode], because Products contains duplicate codes. What is the best fix?',options:['Correct or remove the duplicate codes in Products, so the key is unique.','Set the relationship to Both.','Turn on Auto date/time.','Hide the ProductCode column.'],answer:0,key:'A',why:'A dimension key must be unique. A many-to-many relationship would work, but it usually hides a data quality problem.'},
{n:38,d:'M',type:'single',stem:'You set a relationship to cross-filter in both directions, and Power BI refuses because it would create ambiguity. What does this mean?',options:['Another filter path already connects the same tables, so filters could flow more than one way.','The tables use different storage modes.','The key columns are text.','The relationship is inactive.'],answer:0,key:'A',why:'Power BI allows only one filter path between two tables. A second path makes the model ambiguous.'},

{n:40,d:'M',type:'yn',stem:'For each statement about date tables, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'When a Date table relates to fact tables on an integer DateKey, marking it as a date table lets time intelligence work correctly.',a:true},{t:'Auto date/time creates a hidden date table for each date column in the model.',a:true},{t:'You must mark a date table before you can use the CALENDAR function.',a:false}],key:'Yes, Yes, No',why:'Marking tells Power BI which column holds the dates, which matters when relationships use a non-date key. CALENDAR doesn’t depend on it.'},
{n:41,d:'M',type:'single',code:true,stem:'Margin % must be correct at every level, including totals. Which approach should you use?',options:['A measure: DIVIDE ( SUM ( Sales[Profit] ), SUM ( Sales[Revenue] ) )','A calculated column of Profit / Revenue, summed in visuals','A calculated column of Profit / Revenue, averaged in visuals','A Power Query column of Profit / Revenue'],answer:0,key:'A',why:'A ratio has to divide the totals at each level. Summing or averaging row-level ratios gives wrong totals.'},
{n:42,d:'M',type:'single',stem:'Which DAX function stacks two tables that have the same columns into one calculated table?',options:['UNION','CROSSJOIN','NATURALINNERJOIN','INTERSECT'],answer:0,key:'A',why:'UNION appends the rows of tables with the same number of columns. INTERSECT returns only rows found in both.'},
{n:43,d:'M',type:'single',code:true,stem:'Sales has Quantity and UnitPrice columns but no amount column. Which measure returns revenue?',options:['SUMX ( Sales, Sales[Quantity] * Sales[UnitPrice] )','SUM ( Sales[Quantity] ) * SUM ( Sales[UnitPrice] )','SUM ( Sales[Quantity] * Sales[UnitPrice] )','AVERAGEX ( Sales, Sales[Quantity] * Sales[UnitPrice] )'],answer:0,key:'A',why:'SUMX multiplies on each row and then adds the results. Multiplying two totals is wrong, and SUM accepts only a column.'},
{n:44,d:'M',type:'blanks',stem:'Complete the measure so it returns 0 instead of blank when Units is zero.',code:`Avg Price = DIVIDE ( [Revenue], [Units], [Blank 1] )`,blanks:[{options:['0','BLANK ()','1'],a:0}],key:'0',why:'DIVIDE’s optional third argument is the value returned when the denominator is zero; by default it returns blank.'},
{n:45,d:'M',type:'yn',stem:'For each statement about CALCULATE, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Two filter arguments on different columns are combined with AND.',a:true},{t:'A boolean filter such as Product[Color] = "Red" is shorthand for FILTER ( ALL ( Product[Color] ), Product[Color] = "Red" ).',a:true},{t:'CALCULATE can’t remove filters that come from slicers.',a:false}],key:'Yes, Yes, No',why:'Filter arguments are intersected, and functions such as ALL or REMOVEFILTERS inside CALCULATE can remove slicer filters.'},
{n:46,d:'M',type:'single',code:true,stem:'Which measure returns sales of order lines with a quantity above 10?',options:['CALCULATE ( [Sales], Sales[Quantity] > 10 )','CALCULATE ( [Sales], [Total Quantity] > 10 )','SUM ( Sales[Amount] ) > 10','CALCULATE ( [Sales], ALL ( Sales[Quantity] ) )'],answer:0,key:'A',why:'A boolean filter on a column is valid. A measure can’t be used directly as a boolean filter, and ALL removes the filter instead of applying one.'},
{n:47,d:'M',type:'single',stem:'A Sales PY measure uses SAMEPERIODLASTYEAR and returns blank for every month of 2025, although there are sales in 2024. The Date table starts on 1 January 2025. What should you do?',options:['Extend the Date table so it includes 2024.','Use DATEADD instead.','Mark the Date table again.','Turn on Auto date/time.'],answer:0,key:'A',why:'Time intelligence functions return dates from the Date table, so the earlier year has to exist in it.'},
{n:48,d:'M',type:'blanks',stem:'Complete the measure so it returns sales from 1 March 2026 up to the last date in context.',code:`Campaign Sales =

{n:49,d:'M',type:'single',code:true,stem:'Each month row of a matrix must show sales for the whole previous quarter. Which filter should you use inside CALCULATE?',options:["PREVIOUSQUARTER ( 'Date'[Date] )","DATESQTD ( 'Date'[Date] )","DATEADD ( 'Date'[Date], -1, MONTH )","ENDOFQUARTER ( 'Date'[Date] )"],answer:0,key:'A',why:'PREVIOUSQUARTER returns every date of the quarter before the dates in context.'},
{n:50,d:'M',type:'blanks',stem:'[Order Total] = SUM ( Sales[Amount] ). Complete the measure so it returns the largest single order total in context.',code:`Largest Order = [Blank 1] ( VALUES ( Sales[OrderID] ), [Order Total] )`,blanks:[{options:['MAXX','MAX','TOPN'],a:0}],key:'MAXX',why:'MAXX evaluates the measure for each order and returns the highest result. MAX accepts only a column.'},
{n:51,d:'M',type:'single',stem:'A column holds the values 10, 0, blank and 20. What does AVERAGE return for it?',options:['10','7.5','15','Blank'],answer:0,key:'A',why:'AVERAGE ignores blanks but includes zeros: (10 + 0 + 20) / 3 = 10.'},
{n:52,d:'M',type:'single',stem:'An Active Customers measure uses DISTINCTCOUNT. Its yearly total is lower than the sum of the 12 monthly values. Why?',options:['Customers active in several months are counted once for the year, because distinct counts aren’t additive.','The Date table isn’t marked.','The relationship is bidirectional.','The measure contains an error.'],answer:0,key:'A',why:'A distinct count over a longer period counts each customer once, so it’s normally less than the sum of the shorter periods.'},
{n:53,d:'M',type:'single',stem:'How should an inventory quantity normally be aggregated over time?',options:['By taking the value at the end of the period (or an average), not by adding it up across dates','By summing all the daily values','By counting the rows','By taking the maximum across products'],answer:0,key:'A',why:'Inventory is semi-additive: it adds up across products or warehouses, but not across time.'},
{n:54,d:'M',type:'blanks',stem:'Complete the measure so a card lists the selected product names, separated by a comma and a space.',code:`Selected Products = [Blank 1] ( VALUES ( Product[Name] ), Product[Name], ", " )`,blanks:[{options:['CONCATENATEX','CONCATENATE','COMBINEVALUES'],a:0}],key:'CONCATENATEX',why:'CONCATENATEX joins the values of an expression over a table, with a delimiter. CONCATENATE joins only two text values.'},
{n:55,d:'M',type:'single',stem:'A business user wants a card that lists the selected product names, without writing DAX. Which quick measure fits?',options:['Concatenated list of values','Running total','Star rating','Filtered value'],answer:0,key:'A',why:'The Concatenated list of values quick measure builds a CONCATENATEX measure for you.'},
{n:56,d:'M',type:'single',stem:'Calculation items appear in a slicer in the order PY, YoY %, YTD, but you want YTD, PY, YoY %. What should you set?',options:['The Ordinal of each calculation item','Sort by column on the measure','The precedence of the calculation group','A display folder'],answer:0,key:'A',why:'Each calculation item has an Ordinal that controls its sort order. Precedence controls the order in which calculation groups are applied.'},
{n:57,d:'M',type:'single',stem:'Which statement describes a field parameter rather than a calculation group?',options:['It lets report users choose which measures or columns a visual shows, through a slicer.','It applies the same calculation, such as YTD, to any measure through SELECTEDMEASURE().','It requires Discourage implicit measures to be turned on.','It has a precedence setting.'],answer:0,key:'A',why:'Field parameters swap the fields in a visual. Calculation groups change how measures are calculated.'},
{n:58,d:'M',type:'single',stem:'In DAX query view, which keyword must a query start with (after any DEFINE block)?',options:['EVALUATE','SELECT','RETURN','MEASURE'],answer:0,key:'A',why:'A DAX query returns a table with EVALUATE; DEFINE can come first to declare temporary measures or variables.'},
{n:59,d:'M',type:'single',stem:'Which Performance Analyzer category shows how long a visual takes to draw itself after its data arrives?',options:['Visual display','DAX query','Other','Direct query'],answer:0,key:'A',why:'Visual display is the rendering time. DAX query is the time spent getting the data, and Other is mostly waiting.'},
{n:60,d:'M',type:'single',code:true,stem:'A measure uses IFERROR ( [Profit] / [Revenue], 0 ). What is the better pattern?',options:['DIVIDE ( [Profit], [Revenue], 0 )','IF ( ISERROR ( [Profit] / [Revenue] ), 0 )','[Profit] / [Revenue] + 0','FORMAT ( [Profit] / [Revenue], "0%" )'],answer:0,key:'A',why:'DIVIDE handles division by zero efficiently. Error-trapping functions are slower and can hide other errors.'},

{n:62,d:'M',type:'single',stem:'A UnitCost column is stored with 10 decimal places, but reports show 2. It has millions of distinct values. What reduces model size without changing the reports?',options:['Round UnitCost to 2 decimal places in Power Query.','Format the column to 2 decimal places in the model.','Hide the column.','Change it to Text.'],answer:0,key:'A',why:'Rounding lowers cardinality, which improves compression. Formatting changes only the display.'},
{n:63,d:'M',type:'single',stem:'You want new Power BI Desktop files to have Auto date/time turned off by default. Where do you change this?',options:['Options > Global > Data Load > Time intelligence','Options > Current File > Regional Settings','Model view > Properties','Power Query Editor > Home'],answer:0,key:'A',why:'The Global setting applies to new files; each file also has its own Current File setting.'},

/* ---------- item list ---------- */
const ITEMS = [];
SOURCES.forEach(src => src.Q.forEach(q => {
  const bank = !!src.EXAM.bank, isGoal = q.type === 'goal', isCase = !bank && q.n >= 35;
  ITEMS.push({
    id: bank ? 'b' + q.n : `m${src.EXAM.num}-${q.n}`, bank, q,
    src: bank ? `Practice question ${q.n}` : `Mock Exam ${src.EXAM.num}, question ${q.n}`,
    ctx: isGoal ? {kind:'goal', html: src.GOAL} : isCase ? {kind:'case', title: src.EXAM.caseTitle, html: src.CASE} : null
  });
}));
const BYID = Object.fromEntries(ITEMS.map(it => [it.id, it]));

/* ---------- state ---------- */
function fresh(){ return {screen:'home', hist:{}, flags:{}, f:{dom:['P','M','V','S'], src:'bank', show:'all', order:'random', size:'20'}, session:null}; }
function load(){ try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = Object.assign(fresh(), load() || {});
if (S.session && !S.session.ids.every(id => BYID[id])) { S.session = null; S.screen = 'home'; }

const app = document.getElementById('app');
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function parts(q){ return q.type==='seq' ? q.steps : q.type==='blanks' ? q.blanks.length : q.type==='match' ? q.items.length : q.statements.length; }
function status(q, a){
  if (a === undefined || a === null) return 0;
  if (!Array.isArray(a)) return 2;
  if (q.type === 'multi') return a.length === q.pick ? 2 : (a.length ? 1 : 0);
  const f = a.filter(x => x !== null && x !== undefined).length;
  return f === parts(q) ? 2 : (f ? 1 : 0);
}
function grade(q, a){
  let full = false, part = 0;
  if (q.type === 'single' || q.type === 'goal'){ full = a === q.answer; part = full ? 1 : 0; }
  else if (q.type === 'multi'){ const arr = a || []; const r = arr.filter(x => q.answer.includes(x)).length; full = r === q.answer.length && arr.length === r; part = r / q.answer.length; }
  else if (q.type === 'seq'){ const arr = a || []; part = Math.max(...q.answers.map(alt => alt.filter((x,i) => arr[i] === x).length / alt.length)); full = part === 1; }
  else if (q.type === 'blanks'){ const arr = a || []; part = q.blanks.filter((b,i) => arr[i] === b.a).length / q.blanks.length; full = part === 1; }
  else if (q.type === 'match'){ const arr = a || []; part = q.items.filter((s,i) => arr[i] === s.a).length / q.items.length; full = part === 1; }
  else if (q.type === 'yn'){ const arr = a || []; part = q.statements.filter((s,i) => arr[i] === s.a).length / q.statements.length; full = part === 1; }
  return {full, part, res: full ? 'ok' : (part > 0 ? 'half' : 'no')};
}
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function matching(){
  const f = S.f;
  return ITEMS.filter(it => f.dom.includes(it.q.d)
    && (f.src === 'all' || (f.src === 'bank') === it.bank)
    && (f.show === 'all' || (f.show === 'new' && !S.hist[it.id]) || (f.show === 'wrong' && S.hist[it.id] && S.hist[it.id].last !== 'ok') || (f.show === 'flag' && S.flags[it.id])));
}
