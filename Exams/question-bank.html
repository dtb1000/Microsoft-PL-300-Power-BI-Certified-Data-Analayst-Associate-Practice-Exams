function statsBlock(){
  const ids = Object.keys(S.hist).filter(id => BYID[id]);
  const right = ids.filter(id => S.hist[id].last === 'ok').length;
  const per = {}; Object.keys(DOM).forEach(k => per[k] = {seen:0, ok:0, total:0});
  ITEMS.forEach(it => { per[it.q.d].total++; const h = S.hist[it.id]; if (h){ per[it.q.d].seen++; if (h.last === 'ok') per[it.q.d].ok++; } });
  let h = `<div class="statgrid"><div class="stat"><b>${ids.length}</b><span>of ${ITEMS.length} questions answered</span></div><div class="stat"><b>${ids.length ? Math.round(100*right/ids.length) : 0}%</b><span>right at the last attempt</span></div><div class="stat"><b>${Object.keys(S.flags).filter(k => S.flags[k]).length}</b><span>flagged for review</span></div></div>`;
  h += `<div class="domains">`;
  Object.keys(DOM).forEach(k => { const p = per[k]; const pct = p.seen ? p.ok / p.seen : 0;
    h += `<div class="drow"><b>${DOM[k]}</b><span class="val">${p.seen ? Math.round(pct*100) + '%' : '–'}</span><div class="track" role="img" aria-label="${p.seen} of ${p.total} answered, ${Math.round(pct*100)} percent right"><div class="fill${p.seen && pct < .75 ? ' low' : ''}" style="width:${Math.round(pct*100)}%"></div></div></div>`; });
  return h + `</div><p class="note">Bars show the share answered correctly at the last attempt, per domain. Domains under 75% are marked in red.</p>`;
}
function radio(name, value, label, checked){ return `<label class="c"><input type="radio" name="${name}" value="${value}" data-k="f-${name}" ${checked ? 'checked' : ''}>${label}</label>`; }
function renderHome(){
  const f = S.f, n = matching().length;
  const domCount = d => ITEMS.filter(it => it.q.d === d && (f.src === 'all' || (f.src === 'bank') === it.bank)).length;
  let h = `<div class="layout"><main class="main"><h1>Question bank</h1><p class="lead">${ITEMS.length} PL-300 practice questions. Answer one at a time and see the correct answer and explanation as soon as you submit.</p>`;
  if (S.session && S.screen === 'home' && S.session.i < S.session.ids.length) h += `<p>You have a practice session in progress (question ${S.session.i + 1} of ${S.session.ids.length}).</p><div class="actions" style="margin-top:0;margin-bottom:24px"><button class="btn primary" data-act="resume">Resume session</button></div>`;
  h += `<div class="form" style="margin-top:0"><fieldset><legend>Domains</legend><div class="choices">${Object.keys(DOM).map(d => `<label class="c"><input type="checkbox" value="${d}" data-k="f-dom" ${f.dom.includes(d) ? 'checked' : ''}>${DOM[d]} (${domCount(d)})</label>`).join('')}</div></fieldset>`;
  h += `<fieldset><legend>Questions</legend><div class="choices">${radio('src','bank',`Practice questions only (${ITEMS.filter(i => i.bank).length})`, f.src==='bank')}${radio('src','all',`Practice and mock exam questions (${ITEMS.length})`, f.src==='all')}${radio('src','mock',`Mock exam questions only (${ITEMS.filter(i => !i.bank).length})`, f.src==='mock')}</div><p class="note">Mock exam questions also appear in the ten timed mock exams. If you practise them here first, those mocks will tell you less about how ready you are.</p></fieldset>`;
  h += `<fieldset><legend>Show</legend><div class="choices">${radio('show','all','All questions', f.show==='all')}${radio('show','new','Not answered yet', f.show==='new')}${radio('show','wrong','Not right last time', f.show==='wrong')}${radio('show','flag','Flagged', f.show==='flag')}</div></fieldset>`;
  h += `<fieldset><legend>Order and length</legend><div class="choices">${radio('order','random','Random order', f.order==='random')}${radio('order','seq','In order', f.order==='seq')}</div><div class="choices" style="margin-top:10px">${['10','20','40','all'].map(v => radio('size', v, v === 'all' ? 'All matching' : `${v} questions`, f.size === v)).join('')}</div></fieldset></div>`;
  h += `<p class="count">${n} question${n === 1 ? ' matches' : 's match'} your choices.</p><div class="actions"><button class="btn primary" data-act="start" ${n ? '' : 'disabled'}>Start practice</button><span class="spacer"></span><button class="btn quiet small" data-act="reset" ${Object.keys(S.hist).length ? '' : 'hidden'}>Reset all progress</button></div>`;
  if (Object.keys(S.hist).length) h += `<h2 style="margin-top:40px">Your progress</h2>` + statsBlock();
  return h + `</main>${sideHome()}</div>`;
}
function sideHome(){
  return `<aside class="side"><div class="sheet"><h2>How it works</h2><p class="sub">Choose a set of questions, answer each one and select Submit. The correct answer and its explanation appear straight away.</p><p class="sub">Your answers, results and flags are saved in this browser, so you can stop and resume at any time.</p><p class="sub">For timed practice under exam conditions, use the <a href="index.html">mock exams</a>.</p></div></aside>`;
}

/* ---------- practice ---------- */
function hint(q){
  return q.hint || {single:'Choose one answer.', goal:'Choose Yes or No.', multi:`Choose ${q.pick === 2 ? 'two' : 'three'} answers. Each correct answer presents part of the solution.`, seq:`Choose an action for each of the ${q.steps} steps, in order. Not every action is used.`, blanks:'Choose the correct option for each blank.', yn:'Answer each statement on its own.', match:'Choose the best option for each item.'}[q.type];
}
function body(q, a, done){
  const dis = done ? 'disabled' : '';
  if (q.type === 'single' || q.type === 'goal' || q.type === 'multi'){
    const multi = q.type === 'multi', arr = multi ? (a || []) : null;
    const right = i => multi ? q.answer.includes(i) : i === q.answer;
    const chosen = i => multi ? arr.includes(i) : a === i;
    return `<fieldset class="opts"><legend class="sr">Answer options</legend>${q.options.map((o,i) => {
      let cls = 'opt'; if (done){ if (right(i)) cls += ' right'; else if (chosen(i)) cls += ' wrong'; }
      const cap = multi && !chosen(i) && arr.length >= q.pick;
      const sr = done ? (right(i) ? '<span class="sr">(correct answer)</span>' : chosen(i) ? '<span class="sr">(your answer, incorrect)</span>' : '') : '';
      return `<label class="${cls}"><input type="${multi ? 'checkbox' : 'radio'}" id="q-${i}" name="q" value="${i}" data-k="${multi ? 'multi' : 'single'}" ${chosen(i) ? 'checked' : ''} ${done || cap ? 'disabled' : ''}><span class="bub${multi ? ' sq' : ''}" aria-hidden="true">${L[i]}</span><span class="otext${q.code ? ' mono' : ''}">${fmt(o)} ${sr}</span></label>`; }).join('')}</fieldset>${multi && !done ? `<p class="note">${arr.length} of ${q.pick} chosen.</p>` : ''}`;
  }
  const arr = a || [];
  const markSel = (j, ok, text) => done ? `<p class="mark ${ok ? 'ok' : 'no'}">${ok ? 'Correct' : 'Correct answer: ' + esc(text)}</p>` : '';
  if (q.type === 'seq'){
    let h = `<ul class="actionlist">${q.options.map((o,i) => `<li><b>${L[i]}</b><span>${fmt(o)}</span></li>`).join('')}</ul>`;
    const best = q.answers.reduce((b, alt) => alt.filter((x,i) => arr[i] === x).length > b.filter((x,i) => arr[i] === x).length ? alt : b, q.answers[0]);
    for (let j = 0; j < q.steps; j++){
      h += `<div class="pick"><label for="q-p${j}">Step ${j+1}</label><select id="q-p${j}" data-k="sel" data-j="${j}" ${dis}><option value="">Choose an action</option>${q.options.map((o,i) => `<option value="${i}" ${arr[j] === i ? 'selected' : ''} ${arr.includes(i) && arr[j] !== i ? 'disabled' : ''}>${L[i]}. ${esc(o)}</option>`).join('')}</select>${markSel(j, arr[j] === best[j], L[best[j]] + '. ' + q.options[best[j]])}</div>`;
    }
    return h;
  }
  if (q.type === 'blanks'){
    let h = `<pre class="code">${esc(q.code).replace(/\[Blank (\d)\]/g, '<mark class="blank">[Blank $1]</mark>')}</pre>`;
    q.blanks.forEach((b,j) => { h += `<div class="pick"><label for="q-b${j}">Blank ${j+1}</label><select id="q-b${j}" data-k="sel" data-j="${j}" ${dis}><option value="">Choose an option</option>${b.options.map((o,i) => `<option value="${i}" ${arr[j] === i ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${markSel(j, arr[j] === b.a, b.options[b.a])}</div>`; });
    return h;
  }
  if (q.type === 'match'){
    let h = `<ul class="actionlist">${q.choices.map((o,i) => `<li><b>${L[i]}</b><span>${fmt(o)}</span></li>`).join('')}</ul>`;
    q.items.forEach((it,j) => { h += `<div class="pick wide"><label for="q-m${j}">${j+1}. ${fmt(it.t)}</label><select id="q-m${j}" data-k="sel" data-j="${j}" ${dis}><option value="">Choose an option</option>${q.choices.map((o,i) => `<option value="${i}" ${arr[j] === i ? 'selected' : ''}>${L[i]}. ${esc(o)}</option>`).join('')}</select>${markSel(j, arr[j] === it.a, L[it.a] + '. ' + q.choices[it.a])}</div>`; });
    return h;
  }
  if (q.type === 'yn'){
    return q.statements.map((s,j) => `<div class="yn" role="radiogroup" aria-label="Statement ${j+1}"><p>${j+1}. ${fmt(s.t)}</p><div class="ynopts"><label class="pill"><input type="radio" id="q-s${j}-y" name="q-s${j}" value="1" data-k="yn" data-j="${j}" ${arr[j] === true ? 'checked' : ''} ${dis}>Yes</label><label class="pill"><input type="radio" id="q-s${j}-n" name="q-s${j}" value="0" data-k="yn" data-j="${j}" ${arr[j] === false ? 'checked' : ''} ${dis}>No</label></div>${done ? `<p class="mark ${arr[j] === s.a ? 'ok' : 'no'}">${arr[j] === s.a ? 'Correct' : 'Correct answer: ' + (s.a ? 'Yes' : 'No')}</p>` : ''}</div>`).join('');
  }
  return '';
}
function renderPractice(){
  const se = S.session, it = BYID[se.ids[se.i]], q = it.q, a = se.ans[it.id], done = !!se.res[it.id];
  const counts = {ok:0, half:0, no:0}; Object.values(se.res).forEach(r => counts[r]++);
  let h = `<div class="layout"><main class="main${done ? ' done' : ''}">`;
  h += `<div class="qhead"><p class="qnum">Question ${se.i + 1} of ${se.ids.length}</p><button type="button" class="flagbtn" data-act="flag" aria-pressed="${!!S.flags[it.id]}">${S.flags[it.id] ? 'Flagged for review' : 'Flag for review'}</button></div>`;
  h += `<div class="progress" aria-hidden="true"><span style="width:${Math.round(100 * (se.i + (done ? 1 : 0)) / se.ids.length)}%"></span></div>`;
  h += `<p class="bank-meta">${DOM[q.d]}. ${esc(it.src)}.</p>`;
  if (it.ctx && it.ctx.kind === 'goal') h += `<div class="panel goal"><h2>Goal series</h2><p style="margin:0"><b>Goal:</b> ${fmt(it.ctx.html)}</p></div>`;
  if (it.ctx && it.ctx.kind === 'case') h += `<details class="panel" open><summary>Case study: ${esc(it.ctx.title)}</summary>${it.ctx.html}</details>`;
  h += `<p class="hint">${hint(q)}</p><div class="stem">${fmt(q.stem)}</div>${q.exhibit || ''}${body(q, a, done)}`;
  if (!done){
    h += `<div class="actions"><button class="btn quiet" data-act="skip">Skip</button><span class="spacer"></span><button class="btn primary" data-act="submit" ${status(q, a) === 2 ? '' : 'disabled'}>Submit answer</button></div>`;
    if (status(q, a) < 2) h += `<p class="note" style="text-align:right">Answer every part to submit.</p>`;
  } else {
    const r = se.res[it.id];
    h += `<section class="feedback ${r}" aria-live="polite"><h2>${r === 'ok' ? 'Correct' : r === 'half' ? 'Partly right' : 'Incorrect'}</h2><p style="margin:0 0 8px"><b>Correct answer:</b> ${esc(q.type === 'single' ? q.key + '. ' + q.options[q.answer] : q.key)}</p><p class="why">${fmt(q.why)}</p>${q.extra || ''}</section>`;
    h += `<div class="actions"><span class="spacer"></span><button class="btn primary" id="nextbtn" data-act="next">${se.i + 1 < se.ids.length ? 'Next question' : 'See summary'}</button></div>`;
  }
  h += `</main><aside class="side"><div class="sheet"><h2>This session</h2><p class="sub">${Object.keys(se.res).length} of ${se.ids.length} answered</p><div class="tally"><span><b>${counts.ok}</b> correct</span><span><b>${counts.half}</b> partly right</span><span><b>${counts.no}</b> incorrect</span></div><button type="button" class="btn quiet small" data-act="end">End session</button></div></aside></div>`;
  return h;
}
function renderSummary(){
  const se = S.session, counts = {ok:0, half:0, no:0}; Object.values(se.res).forEach(r => counts[r]++);
  const answered = Object.keys(se.res).length;
  const per = {}; Object.keys(DOM).forEach(k => per[k] = {n:0, ok:0});
  Object.entries(se.res).forEach(([id, r]) => { const d = BYID[id].q.d; per[d].n++; if (r === 'ok') per[d].ok++; });
  const missed = se.ids.filter(id => se.res[id] && se.res[id] !== 'ok');
  let h = `<div class="layout"><main class="main"><h2>Session summary</h2><div class="score">${counts.ok}<small> / ${answered}</small></div>`;
  h += `<p class="verdict ${answered && counts.ok / answered >= .75 ? 'pass' : 'fail'}">${answered ? Math.round(100 * counts.ok / answered) : 0}% correct${counts.half ? `, plus ${counts.half} partly right` : ''}.${answered < se.ids.length ? ` ${se.ids.length - answered} skipped or not reached.` : ''}</p>`;
  h += `<div class="domains">`;
  Object.keys(DOM).filter(k => per[k].n).forEach(k => { const p = per[k], pct = p.ok / p.n;
    h += `<div class="drow"><b>${DOM[k]}</b><span class="val">${p.ok} / ${p.n}</span><div class="track" role="img" aria-label="${Math.round(pct*100)} percent"><div class="fill${pct < .75 ? ' low' : ''}" style="width:${Math.round(pct*100)}%"></div></div></div>`; });
  h += `</div>`;
  if (missed.length){
    h += `<h3>Not fully right (${missed.length})</h3><ul class="misslist">${missed.map(id => `<li>${fmt(BYID[id].q.stem.length > 140 ? BYID[id].q.stem.slice(0, 137) + '…' : BYID[id].q.stem)}<small>${esc(BYID[id].src)}, ${DOM[BYID[id].q.d]}</small></li>`).join('')}</ul>`;
  }
  h += `<div class="actions">${missed.length ? '<button class="btn primary" data-act="retrymissed">Practise these again</button>' : ''}<button class="btn" data-act="home">Back to the question bank</button></div>`;
  return h + `</main>${sideHome()}</div>`;
}
function render(){
  const map = {home:renderHome, practice:renderPractice, summary:renderSummary};
  if ((S.screen === 'practice' || S.screen === 'summary') && !S.session) S.screen = 'home';
  app.innerHTML = (map[S.screen] || renderHome)();
}

/* ---------- dialog ---------- */
const dlg = document.getElementById('dlg'); let onOk = null;
function ask(title, text, okLabel, fn){ document.getElementById('dlg-t').textContent = title; document.getElementById('dlg-p').textContent = text; document.getElementById('dlg-ok').textContent = okLabel; onOk = fn; if (dlg.showModal) dlg.showModal(); else fn(); }
document.getElementById('dlg-no').addEventListener('click', () => dlg.close());
document.getElementById('dlg-ok').addEventListener('click', () => { dlg.close(); const f = onOk; onOk = null; if (f) f(); });

/* ---------- actions ---------- */
function go(screen){ S.screen = screen; save(); render(); window.scrollTo({top:0}); }
function startWith(ids){ S.session = {ids, i:0, ans:{}, res:{}}; go('practice'); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'start'){ let ids = matching().map(it => it.id); if (S.f.order === 'random') shuffle(ids); if (S.f.size !== 'all') ids = ids.slice(0, +S.f.size); startWith(ids); }
  else if (act === 'resume'){ go('practice'); }
  else if (act === 'submit'){
    const se = S.session, it = BYID[se.ids[se.i]], g = grade(it.q, se.ans[it.id]);
    se.res[it.id] = g.res;
    const h = S.hist[it.id] || {seen:0, right:0}; h.seen++; if (g.full) h.right++; h.last = g.res; S.hist[it.id] = h;
    save(); render(); const nb = document.getElementById('nextbtn'); if (nb) nb.focus({preventScroll:true});
    const fb = app.querySelector('.feedback'); if (fb) fb.scrollIntoView({block:'nearest'});
  }
  else if (act === 'next' || act === 'skip'){ const se = S.session; if (se.i + 1 < se.ids.length){ se.i++; go('practice'); } else go('summary'); }
  else if (act === 'end'){ ask('End this session?', 'You’ll see a summary of the questions you answered. Your results are kept.', 'End session', () => go('summary')); }
  else if (act === 'flag'){ const id = S.session.ids[S.session.i]; S.flags[id] = !S.flags[id]; if (!S.flags[id]) delete S.flags[id]; save(); render(); }
  else if (act === 'retrymissed'){ startWith(S.session.ids.filter(id => S.session.res[id] && S.session.res[id] !== 'ok')); }
  else if (act === 'home'){ S.session = null; go('home'); }
  else if (act === 'reset'){ ask('Reset all progress?', 'This clears every saved answer, result and flag in the question bank. It doesn’t affect the mock exams.', 'Reset progress', () => { const f = S.f; S = fresh(); S.f = f; go('home'); }); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k; if (!k) return;
  if (k.startsWith('f-')){
    const name = k.slice(2);
    if (name === 'dom') S.f.dom = [...app.querySelectorAll('input[data-k="f-dom"]:checked')].map(x => x.value);
    else S.f[name] = t.value;
    save(); render(); const el = app.querySelector(`input[data-k="${k}"][value="${t.value}"]`); if (el) el.focus({preventScroll:true}); return;
  }
  if (S.screen !== 'practice') return;
  const se = S.session, it = BYID[se.ids[se.i]], q = it.q; if (se.res[it.id]) return;
  let a = se.ans[it.id];
  if (k === 'single') a = +t.value;
  else if (k === 'multi') a = [...app.querySelectorAll('input[data-k="multi"]:checked')].map(x => +x.value);
  else { a = Array.isArray(a) ? a.slice() : Array(parts(q)).fill(null); const j = +t.dataset.j; a[j] = k === 'yn' ? t.value === '1' : (t.value === '' ? null : +t.value); }
  se.ans[it.id] = a; save();
  const id = t.id, y = window.scrollY; render(); window.scrollTo({top:y});
  const el = id && document.getElementById(id); if (el) el.focus({preventScroll:true});
});
render();
</script>
</body>
</html>
