<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL-300 Question Bank</title>
<meta name="description" content="Over 500 PL-300 practice questions with instant answers and explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#15223A; --muted:#56647C; --rule:#D3DAE6;
  --accent:#1E5BBD; --accent-ink:#FFFFFF; --tint:#E5EDFA; --flag:#B97F00; --flag-tint:#FBF0D2;
  --good:#1D7448; --good-tint:#E1F2E8; --bad:#B3261E; --bad-tint:#FBE5E3; --zone:#ECF0F6; --code-bg:#EDF1F7;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1625; --surface:#152035; --ink:#E5EBF5; --muted:#9BA9C0; --rule:#2B3A57;
    --accent:#78A8F5; --accent-ink:#0E1625; --tint:#1C2D4D; --flag:#F2C14E; --flag-tint:#3A3018;
    --good:#5BC891; --good-tint:#16331F; --bad:#F2867B; --bad-tint:#3B1E1C; --zone:#1A2740; --code-bg:#1B2840;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1625; --surface:#152035; --ink:#E5EBF5; --muted:#9BA9C0; --rule:#2B3A57;
  --accent:#78A8F5; --accent-ink:#0E1625; --tint:#1C2D4D; --flag:#F2C14E; --flag-tint:#3A3018;
  --good:#5BC891; --good-tint:#16331F; --bad:#F2867B; --bad-tint:#3B1E1C; --zone:#1A2740; --code-bg:#1B2840;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:700;font-size:16px;line-height:1.25}
.brand span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.clock{text-align:right;line-height:1.2}
.clock span{display:block;font-size:12px;color:var(--muted)}
.clock strong{font-size:22px;font-variant-numeric:tabular-nums}
.clock.low strong{color:var(--flag)}

/* Layout */
.layout{max-width:1180px;margin:0 auto;padding:28px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.main{min-width:0;max-width:760px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:20px}
  .side{position:static}
}

/* Typography */
h1{font-size:clamp(38px,6vw,60px);line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.25;margin:0 0 10px}
h3{font-size:18px;margin:22px 0 8px}
.lead{font-size:19px;color:var(--muted);margin:0 0 24px;max-width:60ch}
p{margin:0 0 14px}

/* Buttons */
.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 20px;border-radius:9px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:14px;padding:7px 12px;min-height:36px}
.btn.quiet{border-color:var(--rule);color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
.actions .spacer{flex:1}

/* Intro */
.rules{list-style:none;padding:0;margin:0 0 26px;border-top:1px solid var(--rule)}
.rules li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:150px 1fr;gap:16px}
.rules b{display:block}
@media (max-width:560px){.rules li{grid-template-columns:1fr;gap:2px}}
fieldset{border:0;padding:0;margin:0}
.mode legend{font-weight:700;margin-bottom:8px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.choice input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.choice small{display:block;color:var(--muted);font-size:15px}

/* Question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.qnum{font-weight:700;font-size:15px;color:var(--muted);margin:0}
.flagbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-tint);color:var(--ink)}
.hint{font-size:15px;color:var(--muted);font-style:italic;margin:0 0 12px}
.stem{font-size:19px;line-height:1.6;margin-bottom:18px}
.opts{margin:0}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:13px 16px;margin:10px 0;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:disabled){cursor:not-allowed;opacity:.55}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.bub.sq{border-radius:8px}
.opt:has(input:checked) .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.otext{padding-top:2px}
.mono{font-family:var(--mono);font-size:14.5px;line-height:1.55;word-break:break-word}
pre.code{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 18px;white-space:pre}
mark.blank{background:var(--flag-tint);color:var(--ink);border:1px dashed var(--flag);border-radius:4px;padding:0 3px}
.pick{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;margin:10px 0}
.pick label{font-weight:700;font-size:15px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:9px;padding:10px 12px;width:100%;min-height:46px}
@media (max-width:560px){.pick{grid-template-columns:1fr;gap:4px}}
.actionlist{list-style:none;padding:0;margin:0 0 16px}
.actionlist li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.actionlist li:last-child{border-bottom:0}
.actionlist b{flex:none;width:22px}
.yn{padding:12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.yn p{margin:0}
.ynopts{display:flex;gap:8px}
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:42px;padding:6px 14px;border:1.5px solid var(--rule);border-radius:999px;cursor:pointer;font-weight:700;background:var(--surface)}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.yn{grid-template-columns:1fr}}
.note{font-size:15px;color:var(--muted);margin-top:14px}

/* Context panels */
.panel{border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);padding:16px 18px;margin-bottom:24px}
.panel.goal{border-left:5px solid var(--flag)}
.panel h2{font-size:18px;margin-bottom:6px}
details.panel summary{font-weight:700;cursor:pointer;font-size:18px}
details.panel[open] summary{margin-bottom:10px}
.panel ul{padding-left:20px;margin:0 0 12px}
.panel li{margin:4px 0}
.exhibit{width:100%;height:auto;display:block;margin:6px 0 14px}
.exhibit text{font-family:var(--font)}
.x-title{font-weight:700;font-size:15px;fill:var(--ink)}
.x-zone{fill:var(--zone);stroke:var(--rule)}
.x-box{fill:var(--surface);stroke:var(--muted);stroke-width:1.25}
.x-main{fill:var(--tint);stroke:var(--accent);stroke-width:2}
.x-n{font-weight:700;font-size:13px;fill:var(--ink)}
.x-s{font-size:11.5px;fill:var(--muted)}
.x-zn{font-size:11.5px;font-weight:700;fill:var(--muted)}
.x-line{fill:none;stroke:var(--muted);stroke-width:1.25}
.x-ah{fill:var(--muted)}

/* Answer sheet */
.sheet{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:18px}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet .sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.grp{margin:14px 0 0}
.grp p{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.cell{aspect-ratio:1;width:100%;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell.part{background:linear-gradient(to top,var(--ink) 50%,transparent 50%);color:var(--ink)}
.cell.part span{background:var(--surface);border-radius:4px;padding:0 2px;line-height:1.1}
.cell.ans{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cell.flag{box-shadow:0 0 0 3px var(--flag)}
.cell.cur{outline:2px solid var(--accent);outline-offset:3px}
.cell:disabled{cursor:default;opacity:.5;border-style:dashed}
.cell.ok{background:var(--good);border-color:var(--good);color:var(--surface);opacity:1;border-style:solid}
.cell.half{background:var(--flag);border-color:var(--flag);color:var(--surface);opacity:1;border-style:solid}
.cell.no{background:var(--bad-tint);border-color:var(--bad);color:var(--bad);opacity:1;border-style:solid}
.legend{list-style:none;padding:0;margin:16px 0 0;font-size:13px;color:var(--muted);display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.dot.ans{background:var(--ink);border-color:var(--ink)}
.dot.flag{box-shadow:0 0 0 2.5px var(--flag)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.half{background:var(--flag);border-color:var(--flag)}
.dot.no{background:var(--bad-tint);border-color:var(--bad)}
.sheet .btn{width:100%;margin-top:16px}

/* Results */
.score{font-size:clamp(72px,14vw,128px);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0 10px}
.score small{font-size:.38em;color:var(--muted);font-weight:400;letter-spacing:0}
.verdict{font-size:19px;margin:0 0 6px}
.verdict.pass{color:var(--good)}
.verdict.close{color:var(--flag)}
.verdict.fail{color:var(--bad)}
.domains{margin:28px 0 0;border-top:1px solid var(--rule)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.drow b{font-size:16px}
.drow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.track{grid-column:1 / -1;height:10px;border-radius:999px;background:var(--zone);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px}
.fill.low{background:var(--bad)}

/* Review */
.filter{display:flex;gap:10px;align-items:center;margin:8px 0 18px;font-size:16px;cursor:pointer}
.filter input{width:18px;height:18px;accent-color:var(--accent)}
.rcard{border:1.5px solid var(--rule);border-left-width:6px;border-radius:12px;background:var(--surface);padding:16px 18px;margin:0 0 16px}
.rcard.ok{border-left-color:var(--good)}
.rcard.half{border-left-color:var(--flag)}
.rcard.no{border-left-color:var(--bad)}
.rtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.rtop b{font-size:15px;color:var(--muted)}
.tag{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.ok{background:var(--good-tint);color:var(--good)}
.tag.half{background:var(--flag-tint);color:var(--ink)}
.tag.no{background:var(--bad-tint);color:var(--bad)}
.rstem{font-size:16.5px;margin:0 0 12px}
.ans-grid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;font-size:15.5px;margin:0 0 10px}
.ans-grid dt{color:var(--muted)}
.ans-grid dd{margin:0;font-weight:700}
@media (max-width:560px){.ans-grid{grid-template-columns:1fr;gap:0}.ans-grid dd{margin-bottom:6px}}
.why{font-size:15.5px;margin:0;padding-top:10px;border-top:1px solid var(--rule)}

/* Dialog */
dialog{border:1.5px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink);max-width:460px;width:calc(100% - 40px);padding:24px}
dialog::backdrop{background:rgba(8,14,26,.5)}
dialog h2{font-size:21px}
dialog .actions{margin-top:20px;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.opt,.pill,.cell{transition:background-color .12s,border-color .12s}}
.pick.wide{grid-template-columns:1fr;gap:6px}
.pick.wide label{font-weight:400;font-size:16px}
.xcap{font-size:14px;color:var(--muted);margin:0 0 6px}
.xwrap{overflow-x:auto;margin:0 0 18px}
.xt{border-collapse:collapse;font-family:var(--mono);font-size:14px}
.xt td{border:1px solid var(--rule);padding:6px 12px;background:var(--surface)}
.xt tr:first-child td{background:var(--zone);font-weight:600}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:14px}
.foot p{max-width:70ch;border-top:1px solid var(--rule);padding-top:16px}
.brand a{color:var(--accent)}

/* ---------- question bank additions ---------- */
.bank-meta{font-size:14px;color:var(--muted);margin:0 0 4px}
.progress{height:8px;border-radius:999px;background:var(--zone);overflow:hidden;margin:6px 0 22px}
.progress span{display:block;height:100%;background:var(--accent)}
.tally{display:flex;gap:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink)}
.done .opt{cursor:default;opacity:1}
.done .opt:has(input:disabled){opacity:1}
.done .opt.right{border-color:var(--good);background:var(--good-tint)}
.done .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.done .opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.done .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.sheet a,.main a{color:var(--accent)}
.mark{grid-column:2;font-size:14.5px;font-weight:700;margin-top:-4px}
.mark.ok{color:var(--good)} .mark.no{color:var(--bad)}
@media (max-width:560px){.mark{grid-column:1}}
.yn .mark{grid-column:1 / -1;margin-top:0}
.feedback{border:1.5px solid var(--rule);border-left-width:6px;border-radius:12px;background:var(--surface);padding:16px 18px;margin-top:22px}
.feedback.ok{border-left-color:var(--good)} .feedback.half{border-left-color:var(--flag)} .feedback.no{border-left-color:var(--bad)}
.feedback h2{font-size:20px;margin:0 0 6px}
.feedback.ok h2{color:var(--good)} .feedback.no h2{color:var(--bad)}
.feedback .why{border-top:0;padding-top:4px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 8px}
.stat{background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
@media (max-width:560px){.statgrid{grid-template-columns:1fr}}
.form{margin-top:28px;border-top:1px solid var(--rule)}
.form fieldset{padding:16px 0;border-bottom:1px solid var(--rule)}
.form legend{font-weight:700;margin-bottom:6px;float:left;width:100%}
.form .choices{clear:both;display:flex;flex-wrap:wrap;gap:8px 18px}
.form label.c{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:16px}
.form label.c input{width:18px;height:18px;accent-color:var(--accent)}
.form .note{clear:both;margin:6px 0 0}
.count{font-weight:700;font-size:18px;margin:18px 0 0}
.misslist{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--rule)}
.misslist li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:15.5px}
.misslist small{display:block;color:var(--muted)}
.side .sheet .btn{margin-top:10px}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">PL-300 Question Bank<span>Microsoft Power BI Data Analyst practice. <a href="index.html">See all exams</a></span></div>
</div></header>
<div id="app"></div>
<footer class="foot"><p>Unofficial practice material, not affiliated with or endorsed by Microsoft. Written against the PL-300 skills measured as of April 20, 2026, and last reviewed on 9 November 2026.</p></footer>
<dialog id="dlg"><h2 id="dlg-t"></h2><p id="dlg-p"></p><div class="actions"><button class="btn quiet" id="dlg-no" type="button">Cancel</button><button class="btn primary" id="dlg-ok" type="button">OK</button></div></dialog>

<script>
const KEY = 'pl300-bank-v1', L = 'ABCDE';
const DOM = {P:'Prepare the data', M:'Model the data', V:'Visualize and analyze the data', S:'Manage and secure Power BI'};
const SRC_LABEL = {bank:'Practice questions only', all:'Practice and mock exam questions', mock:'Mock exam questions only'};

function flowSVG(id, title, sources, center, outs){
  const top = 64, sh = 72, oh = 56, gap = 16;
  const sTot = sources.length*sh + (sources.length-1)*gap;
  const oTot = outs.length*oh + (outs.length-1)*gap;
  const span = Math.max(sTot, oTot, 72);
  const mid = top + span/2, sTop = top + (span-sTot)/2, oTop = top + (span-oTot)/2;
  const t = (x,y,cls,s) => `<text x="${x}" y="${y}" class="${cls}">${esc(s)}</text>`;
  let h = `<svg class="exhibit" viewBox="0 0 760 ${top+span+24}" role="img" aria-label="${esc(title)}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="x-ah"/></marker></defs>${t(24,30,'x-title',title)}`;
  const sy = [];
  sources.forEach((s,i) => { const y = sTop + i*(sh+gap); sy.push(y+36); h += `<rect x="24" y="${y}" width="224" height="${sh}" rx="8" class="x-box"/>` + t(40,y+24,'x-n',s[0]) + t(40,y+40,'x-s',s[1]) + t(40,y+56,'x-s',s[2]); });
  const cy = mid - 36;
  h += `<rect x="290" y="${cy}" width="180" height="72" rx="8" class="x-main"/>` + t(306,cy+24,'x-n',center[0]) + t(306,cy+40,'x-s',center[1]) + t(306,cy+56,'x-s',center[2]);
  const oy = [];
  outs.forEach((o,i) => { const y = oTop + i*(oh+gap); oy.push(y+28); h += `<rect x="496" y="${y}" width="240" height="${oh}" rx="8" class="x-box"/>` + t(512,y+24,'x-n',o[0]) + t(512,y+40,'x-s',o[1]); });
  h += `<g class="x-line">`;
  sy.forEach(y => { h += `<path d="M248 ${y}H270"/>`; });

function rebalanceQ(EXAM, Q){
  if (!EXAM.shuffle) return;
  const pattern = [2,0,3,1,1,3,0,2,3,1,2,0,0,2,1,3];
  let c = EXAM.num * 5;
  Q.forEach(q => {
    if (q.type === 'single' && q.options.length >= 3){
      const k = q.options.length, target = pattern[c++ % pattern.length] % k;
      const right = q.options[q.answer];
      const rest = q.options.filter((o,i) => i !== q.answer);
      rest.splice(target, 0, right);
      q.options = rest; q.answer = target; q.key = L[target];
    } else if (q.type === 'multi'){
      const k = q.options.length, r = (q.n + EXAM.num) % k;
      q.options = q.options.map((o,i) => q.options[(i + r) % k]);
      q.answer = q.answer.map(j => (j - r + k) % k).sort((a,b) => a-b);
      q.key = q.answer.map(i => L[i]).join(', ');
    } else if (q.type === 'blanks'){
      q.blanks.forEach((b, j) => {
        const k = b.options.length, r = (q.n + j + EXAM.num) % k;
        b.options = b.options.map((o,i) => b.options[(i + r) % k]);
        b.a = (b.a - r + k) % k;
      });
    }
  });
}

{n:2,d:'P',type:'single',stem:'You combine an on-premises SQL Server source set to Organizational with a SharePoint Online workbook set to Private. Power Query raises a Formula.Firewall error. Both sources are internal and may be combined, but neither may be sent to public sources. What should you do?',options:['Set both sources to Public.','Set the SharePoint workbook to Organizational.','Set both sources to Private.','Set the SQL Server source to None.'],answer:1,key:'B',why:'Data from a Private source may not be sent to any other source, so the firewall blocks the combination. Two Organizational sources combine freely and are still protected from Public ones.'},
{n:3,d:'P',type:'single',stem:'Which data source cannot be used in DirectQuery mode?',options:['Azure SQL Database','An Excel workbook','Azure Synapse Analytics','SQL Server'],answer:1,key:'B',why:'Files (Excel, CSV) support Import only. Relational databases support DirectQuery.'},
{n:4,d:'P',type:'single',stem:'A published semantic model uses a query parameter named Country to filter rows. A colleague without Power BI Desktop must change the value to “Belgium” and refresh. Where can they do this?',options:['In the report’s Filters pane','In the semantic model’s settings in the service, under Parameters','In the workspace’s settings','Nowhere; parameters can only change in Desktop'],answer:1,key:'B',why:'Query parameters can be edited in the semantic model settings in the service, followed by a refresh.'},
{n:5,d:'P',type:'single',stem:'A Customers query has several rows per CustomerID, one per update, each with a ModifiedDate. You need only the most recent row per customer. Which approach is reliable in Power Query?',options:['Remove Duplicates on CustomerID without sorting.','Sort by ModifiedDate descending, wrap the sorted table in Table.Buffer, then Remove Duplicates on CustomerID.','Sort by CustomerID ascending, then Remove Duplicates on ModifiedDate.','Keep Top Rows: 1.'],answer:1,key:'B',why:'Remove Duplicates keeps the first row it meets; Table.Buffer fixes the sort order so the newest row is first. Group By with Max and a merge back also works.'},
{n:6,d:'P',type:'single',stem:'You need a SizeBand column: “Small” when Quantity < 10, “Medium” when Quantity < 100, otherwise “Large”, built without writing M. What should you add?',options:['A Conditional Column','An Index Column','A Duplicate Column','A Rank Column'],answer:0,key:'A',why:'Conditional Column builds if-then-else logic through a dialog.'},
{n:7,d:'P',type:'single',stem:'A table has columns Site, Metric and Value, with metrics such as Yield, Purity and Volume. You need one column per metric. Which transformation should you use?',options:['Unpivot Columns on Metric','Pivot Column on Metric, with Value as the values column and Don’t Aggregate','Transpose','Group By Metric'],answer:1,key:'B',why:'Pivot turns the Metric values into columns; Don’t Aggregate keeps the values as they are.'},
{n:8,d:'P',type:'single',stem:'You append Sales2025 (column CustomerID) and Sales2026 (column Cust_ID). The result has two customer columns, each half null. What should you do?',options:['Merge the queries instead.','Rename Cust_ID to CustomerID in Sales2026 before appending.','Fill Down both columns.','Remove the null rows.'],answer:1,key:'B',why:'Append matches columns by name, so names must match.'},
{n:9,d:'P',type:'single',stem:'An imported table of 2015–2020 history never changes. You want to shorten refresh time while keeping the table in the model. What should you do?',options:['Disable Enable load for the query.','Clear Include in report refresh for the query.','Switch the table to DirectQuery.','Delete the query.'],answer:1,key:'B',why:'Clearing Include in report refresh keeps the loaded data but skips it during refresh. Disabling load removes it from the model.'},
{n:10,d:'M',type:'single',stem:'Product and ProductDetails each have one row per ProductID. When you relate them, which cardinality and cross-filter direction does Power BI apply?',options:['One-to-many, single','One-to-one, both','Many-to-many, single','One-to-one, single'],answer:1,key:'B',why:'Unique keys on both sides give one-to-one, which defaults to Both. Merging the tables is often better design.'},
{n:11,d:'M',type:'yn',stem:'For each statement, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Calculated columns are computed during refresh and stored in the model.',a:true},{t:'Measures are evaluated at query time in the current filter context.',a:true},{t:'A calculated column recalculates when a user changes a slicer.',a:false}],key:'Yes, Yes, No',why:'Calculated columns are static after refresh and do not respond to slicers; measures do.'},
{n:12,d:'M',type:'single',stem:'You want users of Excel to look up customers from your semantic model by typing a customer name into a cell and converting it to a data type. Which table property should you configure?',options:['Is hidden','Is featured table','Storage mode','Key column only'],answer:1,key:'B',why:'A featured table exposes rows to Excel’s organisation data types.'},
{n:13,d:'M',type:'single',code:true,stem:'You need sales for products whose [Margin %] measure exceeds 40%. Which measure is valid?',options:['CALCULATE ( [Sales], [Margin %] > 0.4 )','CALCULATE ( [Sales], FILTER ( VALUES ( Product[ProductKey] ), [Margin %] > 0.4 ) )','CALCULATE ( [Sales], Product[Margin %] > 0.4 )','SUMX ( Product, [Margin %] > 0.4 )'],answer:1,key:'B',why:'Boolean filters in CALCULATE cannot use measures. FILTER iterates products and evaluates the measure for each.'},
{n:14,d:'M',type:'single',code:true,stem:'In a table by day, you need each day’s sales next to sales on the same day of the previous month. Which filter should you use inside CALCULATE?',options:["PARALLELPERIOD ( 'Date'[Date], -1, MONTH )","DATEADD ( 'Date'[Date], -1, MONTH )","PREVIOUSMONTH ( 'Date'[Date] )","DATESMTD ( 'Date'[Date] )"],answer:1,key:'B',why:'DATEADD shifts each date by one month. PARALLELPERIOD and PREVIOUSMONTH return the whole previous month.'},
{n:15,d:'M',type:'single',code:true,stem:'A card must show average monthly sales for whatever period is selected (for example, a year shows total sales divided by 12 months). Which measure should you use?',options:['AVERAGE ( Sales[Amount] )',"AVERAGEX ( VALUES ( 'Date'[Year Month] ), [Sales] )",'DIVIDE ( [Sales], COUNTROWS ( Sales ) )','AVERAGEX ( Sales, Sales[Amount] )'],answer:1,key:'B',why:'AVERAGEX over months computes sales per month, then averages them.'},
{n:16,d:'M',type:'single',stem:'A time intelligence calculation group has items Current, PY and YoY %. YoY % shows as currency because the base measures are formatted as currency. How should you fix it?',options:['Change the base measures’ format to percentage.','Set a format string expression on the YoY % calculation item.','Create a separate calculation group for percentages.','Use FORMAT() in every base measure.'],answer:1,key:'B',why:'Calculation items can carry a dynamic format string expression that overrides the measure’s format.'},
{n:17,d:'M',type:'single',stem:'In Performance Analyzer, a visual shows DAX query 40 ms, Visual display 60 ms and Other 4,200 ms. What does this most likely indicate?',options:['The measure is poorly written.','The visual waited for other visuals on the page; the page has too many visuals.','The gateway is slow.','The relationship is bidirectional.'],answer:1,key:'B',why:'Other is time spent waiting, usually for other visuals or processing on a crowded page.'},
{n:18,d:'M',type:'single',stem:'Sales relates to Customer on a 36-character text CustomerCode. Which change most improves model compression and relationship performance?',options:['Make the relationship bidirectional.','Replace the text key with an integer surrogate key in both tables.','Add an index on CustomerCode in Power Query.','Mark CustomerCode as hidden.'],answer:1,key:'B',why:'Integer keys compress better and join faster than long text keys.'},
{n:19,d:'V',type:'match',stem:'Match each requirement to the most suitable visual. Each visual may be used once or not at all.',hint:'Choose a visual for each requirement.',items:[{t:'Compare actual versus budget across 12 product categories.',a:1},{t:'Show the share of revenue from three sales channels.',a:2},{t:'Show how order values are distributed across value ranges.',a:3},{t:'Show the relationship between advertising spend and revenue across 200 stores.',a:0}],choices:['Scatter chart','Clustered bar chart','Donut chart','Column chart on a binned field','Ribbon chart'],key:'1-B, 2-C, 3-D, 4-A',why:'Bars compare categories; a donut suits few parts of a whole; a binned column chart is a histogram; a scatter shows correlation.'},
{n:20,d:'V',type:'single',stem:'A slicer must always show the last 30 days, moving forward automatically each day. Which slicer configuration should you use?',options:['Between, with fixed dates','Relative date: Last 30 days','Dropdown with all dates selected','List with Select all'],answer:1,key:'B',why:'Relative date slicers roll forward with the current date.'},
{n:21,d:'V',type:'yn',stem:'For each statement about the Filters pane, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A locked filter is visible to report readers but they cannot change it.',a:true},{t:'A hidden filter still filters the visuals.',a:true},{t:'Filters pane settings are a security boundary that readers cannot bypass.',a:false}],key:'Yes, Yes, No',why:'Locked filters are read-only; hidden filters still apply; only RLS and OLS are security.'},
{n:22,d:'V',type:'single',stem:'A button must be disabled until the user selects one product in a chart, then take the user to the Product Details page filtered to that product. What should you configure?',options:['A button with a Page navigation action','A button with a Drill through action and Product Details as the destination','A bookmark with Selected visuals','A button with a Back action'],answer:1,key:'B',why:'A drillthrough-action button stays disabled until a valid selection is made, then drills through with it.'},
{n:23,d:'V',type:'single',stem:'A drillthrough page must not appear as a tab or in the page navigator, but drillthrough must still work. What should you do?',options:['Delete the page tab.','Hide the page.','Set the page size to Tooltip.','Move the page to the end.'],answer:1,key:'B',why:'Hidden pages stay available as drillthrough targets.'},
{n:24,d:'V',type:'single',stem:'You want to use Copilot in Power BI Desktop to create a report page from a prompt. Which prerequisite applies?',options:['The report must use DirectQuery.','You must be connected to a workspace on a paid Fabric capacity (or Premium P), with Copilot enabled by the tenant admin.','The semantic model must be certified.','A gateway must be installed.'],answer:1,key:'B',why:'Copilot in Power BI needs a paid Fabric capacity (F2 or higher) or Premium P1 or higher, and the admin must enable it.'},
{n:25,d:'V',type:'yn',stem:'For each statement about visual calculations, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A visual calculation can refer to fields on the visual’s axes and values.',a:true},{t:'Visual calculations are stored in the semantic model and can be reused in other visuals.',a:false},{t:'MOVINGAVERAGE can compute a three-period moving average inside the visual.',a:true}],key:'Yes, No, Yes',why:'Visual calculations live in one visual only; functions such as RUNNINGSUM, MOVINGAVERAGE and PREVIOUS work on the visual’s grid.'},
{n:26,d:'V',type:'single',stem:'A column chart shows a drop in sales in March. You want Power BI to look for which fields explain the drop. What should you do?',options:['Right-click the March column and select Analyze > Explain the decrease.','Add a trend line.','Add error bars.','Add a forecast.'],answer:0,key:'A',why:'Analyze > Explain the increase/decrease ranks fields that explain a change between data points.'},
{n:27,d:'V',type:'single',stem:'You need to combine 40 countries into five custom sales areas for one report, without changing the source data. What should you create?',options:['A list group on the Country field','A bin group on the Country field','A calculated table','A cluster'],answer:0,key:'A',why:'List groups combine chosen category values; bins are for numbers and dates.'},
{n:28,d:'S',type:'single',stem:'Staff should see a report on an intranet page, and each viewer’s existing Power BI permissions and RLS must apply. Which distribution method should you use?',options:['Publish to web','Embed in SharePoint Online with the Power BI web part','Email a PDF export','Share a link that works for people in your organization, with a public QR code'],answer:1,key:'B',why:'The SharePoint Online web part respects permissions and RLS. Publish to web is public to anyone.'},
{n:29,d:'S',type:'single',stem:'A user who can view a report must analyse its semantic model in Excel with Analyze in Excel. What else do they need?',options:['Reshare permission on the report','Build permission on the semantic model','The Contributor role','A gateway'],answer:1,key:'B',why:'Analyze in Excel, like building reports, requires Build permission on the semantic model.'},
{n:30,d:'S',type:'single',stem:'A Security table has one row per UserEmail and RegionID, because some users manage several regions. The model is shown in the exhibit. Users who sign in see no rows. What should you do?',exhibit:Q30_SVG,options:['Change the filter to USERNAME().','Set the Security–Region relationship to Both and select Apply security filter in both directions.','Make the Region–Sales relationship many-to-many.','Hide the Security table.'],answer:1,key:'B',why:'In the exhibit, filters only flow out of Region. The role filter sits on Security (the many side), so it must flow back to Region: that needs Both plus Apply security filter in both directions.'},
{n:31,d:'S',type:'yn',stem:'For each statement about sensitivity labels, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A sensitivity label on its own prevents users with access from opening a report in the service.',a:false},{t:'Reports created from a labelled semantic model can inherit its label.',a:true},{t:'A PDF exported from a labelled report carries the label.',a:true}],key:'No, Yes, Yes',why:'Labels classify and protect exported files; access in the service is still controlled by permissions. Downstream inheritance is supported.'},
{n:32,d:'M',type:'goal',stem:"Solution: `Sales PY = CALCULATE ( [Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )`. Does this meet the goal?",options:['Yes','No'],answer:0,key:'Yes',why:'SAMEPERIODLASTYEAR shifts the month’s dates back one year.'},
{n:33,d:'M',type:'goal',stem:"Solution: `Sales PY = CALCULATE ( [Sales], DATEADD ( 'Date'[Date], -1, YEAR ) )`. Does this meet the goal?",options:['Yes','No'],answer:0,key:'Yes',why:'DATEADD by -1 year gives the same result at month level.'},
{n:34,d:'M',type:'goal',stem:"Solution: `Sales PY = CALCULATE ( [Sales], PREVIOUSYEAR ( 'Date'[Date] ) )`. Does this meet the goal?",options:['Yes','No'],answer:1,key:'No',why:'PREVIOUSYEAR returns all dates of the previous year, so every month would show last year’s full total.'},
{n:35,d:'P',type:'single',stem:'Which privacy levels should you assign?',options:['Oracle: Public; fuel API: Public','Oracle: Organizational; fuel API: Public','Oracle: None; fuel API: Private','Oracle: Public; fuel API: Organizational'],answer:1,key:'B',why:'Organizational data cannot be sent to Public sources, which meets the requirement while allowing the combination.'},
{n:36,d:'M',type:'single',stem:'What should you do with the Salary column?',options:['Hide it.','Remove it in Power Query.','Apply RLS to it.','Move it to a separate table.'],answer:1,key:'B',why:'Removing unused columns is the most effective way to shrink a model. Hidden columns still take space.'},
{n:37,d:'M',type:'single',stem:'Which function should you use for the typical delivery time?',options:['AVERAGE','MEDIAN','MAX','STDEV.P'],answer:1,key:'B',why:'The median is robust to extreme outliers; the mean is not.'},
{n:38,d:'M',type:'blanks',stem:'Complete the on-time percentage measure.',code:`On-time % =

{n:39,d:'S',type:'single',stem:'How should you meet the Teams requirement?',options:['Add the report as a tab in the dispatch team’s channel.','Publish the report to the web and post the link.','Email a daily PDF to the channel.','Create a paginated report.'],answer:0,key:'A',why:'Power BI reports can be added as tabs in Teams channels.'},
{n:40,d:'S',type:'multi',pick:2,stem:'Which two actions are required for the nightly refresh?',options:['Install a standard mode on-premises data gateway and add a connection to the Oracle database.','Configure scheduled refresh at 02:00 in the semantic model settings.','Enable automatic page refresh.','Move the workspace to Premium Per User.','Switch the Shipments table to DirectQuery.'],answer:[0,1],key:'A, B',why:'An on-premises Oracle source needs a standard gateway with a connection to the database, plus a scheduled refresh.'}

{n:1,d:'P',type:'single',stem:'Your organisation publishes a certified Sales semantic model. You need a new report on it with no changes to the model. How should you connect?',options:['Import the underlying SQL tables again.','Get data > Power BI semantic models, creating a live connection.','Export the model to Excel and import the file.','Use the Web connector with the model’s URL.'],answer:1,key:'B',why:'A live connection reuses the shared model as is; nothing is duplicated.'},

{n:3,d:'P',type:'single',stem:'Which statement about Direct Lake storage mode is true?',options:['It needs a scheduled import refresh that copies data into the model.','It loads Delta (Parquet) tables from OneLake into memory on demand.','It can connect to an on-premises SQL Server through a gateway.','It is available on Pro workspaces without capacity.'],answer:1,key:'B',why:'Direct Lake pages Delta/Parquet column data from OneLake into memory; it needs Fabric capacity and no import copy.'},
{n:4,d:'P',type:'single',stem:'A PostalCode column from Excel shows 1234 instead of 01234 after import. What should you do?',options:['Add a custom column that adds a leading zero to every value.','Change the column’s data type to Text in the automatic Changed Type step (or remove that step’s conversion for this column).','Format the column as a whole number with five digits.','Change the locale of the file.'],answer:1,key:'B',why:'Codes with leading zeros are identifiers, not numbers, so they must be Text before any numeric conversion.'},

{n:12,d:'M',type:'single',stem:'You need a ProfitBand column on Sales for use in slicers. Where should you create it to give the best compression and reuse, following the principle of transforming as far upstream as possible?',options:['As a DAX calculated column','As a measure','In Power Query (or the source)','As a visual calculation'],answer:2,key:'C',why:'Columns created upstream compress better and can be reused across models; DAX calculated columns are a last resort.'},

{n:14,d:'M',type:'single',code:true,stem:"You have `Sales YTD = TOTALYTD ( [Sales], 'Date'[Date] )`. You need last year’s year-to-date for the same point in the year. Which measure should you use?",options:["CALCULATE ( [Sales YTD], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )","CALCULATE ( [Sales], PREVIOUSYEAR ( 'Date'[Date] ) )","TOTALYTD ( [Sales], PREVIOUSYEAR ( 'Date'[Date] ) )","[Sales YTD] - [Sales]"],answer:0,key:'A',why:'Shifting the YTD measure’s dates back a year gives prior-year YTD to the same day.'},
{n:15,d:'M',type:'single',stem:'A card must show each month’s opening stock balance, which equals the closing balance at the end of the previous month. Which function is designed for this?',options:['OPENINGBALANCEMONTH','CLOSINGBALANCEMONTH','STARTOFMONTH','TOTALMTD'],answer:0,key:'A',why:'OPENINGBALANCEMONTH evaluates the expression at the last date of the previous month.'},
{n:16,d:'M',type:'single',code:true,stem:'You need the number of orders that have no ship date yet. Which expression should you use?',options:['COUNT ( Sales[ShipDate] )','COUNTBLANK ( Sales[ShipDate] )','COUNTA ( Sales[ShipDate] )','DISTINCTCOUNT ( Sales[ShipDate] )'],answer:1,key:'B',why:'COUNTBLANK counts blank values in a column; COUNT and COUNTA skip blanks.'},
{n:17,d:'M',type:'yn',stem:'For each statement about quick measures, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'A quick measure creates a normal DAX measure that you can view and edit.',a:true},{t:'You must write DAX to create a quick measure.',a:false},{t:'Time intelligence quick measures need a date hierarchy or a column from a marked date table.',a:true}],key:'Yes, No, Yes',why:'Quick measures write ordinary DAX for you; time intelligence variants need a proper date column.'},
{n:18,d:'M',type:'single',stem:'A DirectQuery model’s relationships generate slow outer joins. The source guarantees every Sales row has a matching Product row. What should you do?',options:['Set the relationship to Both.','Turn on Assume referential integrity for the relationship.','Switch Product to DirectQuery.','Create a calculated table of products.'],answer:1,key:'B',why:'Assume referential integrity lets DirectQuery use inner joins, which run faster.'},
{n:19,d:'V',type:'single',stem:'You need to show current warehouse utilisation against a maximum of 100%, with a marker at the 85% target. Which visual should you use?',options:['Gauge','Treemap','Funnel','Waterfall'],answer:0,key:'A',why:'A gauge shows a value against a range with a target marker.'},
{n:20,d:'V',type:'single',stem:'A table’s Sales column must show in-cell bars proportional to each value. Which conditional formatting option should you use?',options:['Background colour','Data bars','Icons','Web URL'],answer:1,key:'B',why:'Data bars draw a bar in each cell scaled to its value.'},
{n:21,d:'V',type:'single',stem:'A bookmark must show or hide two visuals without affecting any other visuals on the page. Which bookmark option should you use?',options:['Current page','Selected visuals (with the two visuals selected when you update the bookmark)','Data','All visuals'],answer:1,key:'B',why:'Selected visuals limits a bookmark to the visuals selected when it was saved.'},
{n:22,d:'V',type:'single',stem:'A report page must hold 20 visuals in a long layout that users scroll down in the browser. What should you do?',options:['Set Canvas settings to Custom and increase the height.','Set the page view to Fit to page.','Split the page into a mobile layout.','Use a paginated report.'],answer:0,key:'A',why:'A custom canvas height creates a long, scrollable page.'},
{n:23,d:'V',type:'multi',pick:2,stem:'Users must drill through from visuals in the Sales report to a Customer Details page in a separate report in the same workspace. Which two settings must you enable?',options:['Cross-report on the Customer Details page’s drillthrough settings.','Allow visuals in this report to use drillthrough targets from other reports, in the Sales report’s settings.','Keep all filters on the Sales report.','Sync slicers between the reports.','Publish both reports to the same app audience.'],answer:[0,1],key:'A, B',why:'Cross-report drillthrough needs Cross-report on the target page and the report-level setting on the source report.'},
{n:24,d:'V',type:'yn',stem:'For each statement about automatic page refresh, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Automatic page refresh works for pages whose visuals use only imported tables.',a:false},{t:'A capacity admin can set a minimum refresh interval.',a:true},{t:'The change detection type requires a measure to monitor.',a:true}],key:'No, Yes, Yes',why:'Automatic page refresh needs DirectQuery (or other push/real-time sources); admins set minimum intervals; change detection monitors a measure.'},
{n:25,d:'V',type:'single',stem:'A column chart needs a target line whose value changes when users change the Region slicer. What should you do?',options:['Add a constant line in the Analytics pane and set its value with a target measure (fx).','Add a constant line with a fixed value.','Draw a line shape on the canvas.','Add the target measure to the Legend well.'],answer:0,key:'A',why:'Analytics pane lines can take their value from a measure, so the line responds to filters.'},
{n:26,d:'V',type:'single',stem:'The retention team wants to see the customer groups (combinations of attributes) with the highest churn rate. Which feature shows this?',options:['The Top segments view of the Key influencers visual','A decomposition tree with Absolute splits','A ribbon chart','Anomaly detection'],answer:0,key:'A',why:'Top segments in Key influencers lists attribute combinations with the highest rate of the chosen outcome.'},
{n:27,d:'V',type:'single',stem:'In a table visual, users want to sort by Region and then by Sales within each region. What should they do?',options:['Sort by Region, then Shift+click the Sales column header.','Create a hierarchy of Region and Sales.','You can only sort by one column.','Use Sort by column on the Sales column.'],answer:0,key:'A',why:'Tables and matrices support multi-column sorting with Shift+click.'},
{n:28,d:'S',type:'single',stem:'Contributors in a workspace must be able to publish app updates. What should you do?',options:['Promote them to Admin.','Turn on the workspace setting that allows contributors to update the app.','Give them Build permission.','Add them to the app’s audience.'],answer:1,key:'B',why:'By default only Admins and Members update apps; a workspace setting extends this to Contributors.'},
{n:29,d:'S',type:'single',stem:'You must replace an existing published report with a new version, keeping its URL, dashboard tiles and sharing permissions. What should you do?',options:['Delete the old report, then publish the new one.','Publish from Desktop to the same workspace with the same file name and choose Replace.','Upload the file with a new name.','Save a copy of the report in the service.'],answer:1,key:'B',why:'Republishing with the same name replaces the content in place, keeping its ID, links and permissions.'},
{n:30,d:'S',type:'single',stem:'A user belongs to two RLS roles: North (`Region[Name] = "North"`) and South (`Region[Name] = "South"`). What does the user see?',options:['North only, the first role','No data, because the filters conflict','Both North and South data, because role permissions are additive','All regions'],answer:2,key:'C',why:'RLS roles are additive: a user in several roles sees the union of their filters.'},
{n:31,d:'S',type:'single',stem:'The data team must receive an email whenever a scheduled refresh fails, not only the semantic model owner. What should you configure?',options:['A data alert on a dashboard tile','Refresh failure notification contacts in the semantic model’s scheduled refresh settings','A report subscription','The workspace contact list only'],answer:1,key:'B',why:'Scheduled refresh settings let you add other contacts for failure notifications.'},
{n:32,d:'S',type:'goal',stem:'Solution: Install a standard mode on-premises data gateway, add the file path as a gateway connection, map the semantic model to it, and configure a daily scheduled refresh. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'A file on a network share is on-premises, so a gateway with a mapped connection enables refresh.'},
{n:33,d:'S',type:'goal',stem:'Solution: Move the workbook to a SharePoint Online document library, reconnect the query to the SharePoint file, republish and configure a daily scheduled refresh. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'SharePoint Online is a cloud source; no gateway is needed.'},
{n:34,d:'S',type:'goal',stem:'Solution: Republish without changes and configure a daily scheduled refresh in the semantic model settings, without a gateway. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'The service cannot reach an on-premises network path without a gateway.'},
{n:35,d:'P',type:'single',stem:'Which storage mode should the enrolment tables use?',options:['Import','DirectQuery against the lakehouse SQL analytics endpoint','Direct Lake','Dual'],answer:2,key:'C',why:'Direct Lake suits frequently updated Delta tables in OneLake: near-live, fast and with no import copy.'},
{n:36,d:'M',type:'blanks',stem:'Complete the cumulative enrolment measure.',code:`Cumulative Enrolled =

{n:37,d:'S',type:'single',code:true,stem:'Which RLS role filter should you define on the SponsorUser table?',options:['SponsorUser[Email] = USERPRINCIPALNAME()','SponsorUser[SponsorID] = 1','SponsorUser[Email] = "sponsor@contoso.com"','ISBLANK ( SponsorUser[Email] )'],answer:0,key:'A',why:'Dynamic RLS on a mapping table means new users only need a row in SponsorUser.'},
{n:38,d:'S',type:'single',stem:'Which condition must hold for RLS to restrict what sponsor users see?',options:['Sponsor users must be Members of the workspace.','Sponsor users must not hold the Admin, Member or Contributor workspace role; they consume through the app (or as Viewers).','The report must carry a sensitivity label.','The semantic model must be certified.'],answer:1,key:'B',why:'RLS applies only to users with Viewer-level access (app or Viewer role); editing roles bypass it.'},

SOURCES.push((function(){
const EXAM = {num:6, shuffle:true, caseTitle:'Tailspin Toys', next:'Mock 7'};

const TT_SVG = flowSVG('tta', 'Tailspin Toys: four sources in four places', [
  ['Store sales', 'SQL Server in the data centre', 'Refreshed nightly'],
  ['Online orders', 'Azure SQL Database', 'Private endpoint, no public access'],
  ['Product catalogue', 'Supplier REST API (public)', 'JSON with nested age ranges'],
  ['Marketing report', '.pbix file in OneDrive for Business', 'Edited by the marketing team']
], ['Power BI workspace', 'Fabric F64 capacity', 'Semantic model + reports'], [
  ['Regional managers', 'Same chart for every region'],
  ['Store managers', 'Screen readers, keyboard use'],
  ['Marketing', 'Saves changes in OneDrive']
]);

const GOAL = 'One Power Query query merges data from an on-premises SQL Server with a SharePoint Online list. After publishing, the semantic model must refresh on a schedule in the Power BI service.';

const CASE = `<p><b>Overview.</b> Tailspin Toys sells toys through 85 stores and an online shop. Its Power BI workspace runs on a Fabric F64 capacity.</p>
${TT_SVG}
<h3>Existing environment</h3><ul>
<li>Store sales are in a SQL Server database in the company data centre.</li>
<li>Online orders are in an Azure SQL Database that is reachable only through a private endpoint in an Azure virtual network.</li>
<li>The product catalogue comes from a supplier’s public REST API. Each product record has an <code>ageRanges</code> field that holds a list of values, such as 3–5 and 6–8.</li>
<li>The marketing team keeps its own .pbix report in OneDrive for Business.</li></ul>
<h3>Requirements</h3><ul>
<li>Store and online sales must refresh nightly, without installing or maintaining gateway software on Azure virtual machines.</li>
<li>The product table must have one row per product per age range.</li>
<li>The Category table needs a calculated column with each category’s total sales, used to sort categories.</li>
<li>Regional managers want the same column chart repeated for each of six regions, side by side.</li>
<li>A chart’s alt text must state the currently selected store and its sales, for screen-reader users.</li>
<li>When marketing saves the .pbix file in OneDrive, the published report must update without anyone republishing it.</li></ul>`;

const Q = [
{n:1,d:'P',type:'single',stem:'A Products query has a Tags column like the one in the exhibit, with several tags in one cell separated by semicolons. You need one row per product per tag so that tags can be used in a slicer. What should you do?',exhibit:tableHTML('Exhibit: the Products query (first three rows)',[['ProductID','ProductName','Tags'],['P-101','Stunt Kite','outdoor;summer;kids'],['P-102','Puzzle Cube','indoor;puzzle'],['P-103','Water Blaster','outdoor;summer']]),options:['Split Column by Delimiter, splitting into columns.','Split Column by Delimiter and, under Advanced options, split into rows.','Unpivot the Tags column.','Extract Text Before Delimiter.'],answer:1,key:'B',why:'Splitting into rows creates one row per tag and repeats the product on each row. Splitting into columns creates a varying number of columns that a single slicer can’t use.'},
{n:2,d:'P',type:'single',stem:'A Quantity column contains whole numbers and the text “N/A”. When you change its type to Whole Number, the “N/A” rows show Error. The rows must be kept, with a blank quantity. What should you do?',options:['Change the type, then use Remove Errors.','Replace “N/A” with null, then change the type to Whole Number.','Change the type to Decimal Number instead.','Use Fill Down on the column, then change the type.'],answer:1,key:'B',why:'Replacing the text placeholder with null first lets the type change succeed while keeping every row. Remove Errors would drop those rows, and Fill Down would invent quantities.'},
{n:3,d:'P',type:'single',stem:'The source system renamed the column Cust_Name to CustomerName. Refresh now fails with: Expression.Error: The column ‘Cust_Name’ of the table wasn’t found. What should you do?',options:['Clear the Power Query cache.','Update the applied steps that refer to Cust_Name, such as Changed Type or Renamed Columns.','Change the privacy level of the source.','Disable load for the query.'],answer:1,key:'B',why:'Applied steps refer to columns by name. Update the steps that use the old name, or rename the column back early in the query.'},
{n:4,d:'P',type:'single',stem:'You pivot the Metric column of the table in the exhibit, using Value as the values column and Don’t Aggregate. Some cells in the result show Error. What is the cause, and what should you do?',exhibit:tableHTML('Exhibit: the table before pivoting',[['Site','Metric','Value'],['Ghent','Yield','92'],['Ghent','Yield','94'],['Ghent','Purity','99'],['Leuven','Yield','90']]),options:['The Value column is text; change it to Decimal Number.','A site has more than one value for the same metric; choose an aggregation such as Average or Sum, or remove the duplicate rows first.','Pivot can’t be used on numeric data; use Transpose.','The Metric column contains nulls; use Fill Down first.'],answer:1,key:'B',why:'Don’t Aggregate fails when two rows share the same row and column combination (Ghent, Yield). Aggregate them or remove the duplicates before pivoting.'},
{n:5,d:'P',type:'single',stem:'The source has three related tables: Product (with SubcategoryID), Subcategory (with CategoryID) and Category. Following star schema best practice, how should you model them?',options:['Load all three tables and relate them in a chain.','Merge Subcategory and Category into Product in Power Query, creating one Product dimension.','Merge all three tables into the Sales fact table.','Load only the Category table.'],answer:1,key:'B',why:'A star schema flattens snowflaked dimension tables into one dimension, which simplifies filtering and usually performs better.'},
{n:6,d:'P',type:'multi',pick:2,stem:'You need to merge Sales with Targets on both Year and ProductID. Which two actions should you take? Each correct answer presents part of the solution.',options:['In the Merge dialog, select Year and then ProductID in Sales, and Year and then ProductID in Targets, in the same order.','Make sure Year and ProductID have the same data types in both queries.','Use Append Queries instead of Merge Queries.','Turn on fuzzy matching.','Select the key columns in any order; Power Query matches them by name.'],answer:[0,1],key:'A, B',why:'Multi-column merges pair the columns in the order you select them (Ctrl+click), and keys must have matching data types or rows won’t match.'},
{n:7,d:'P',type:'single',stem:'A DirectQuery report must pass the country selected in a slicer into a query parameter used in the source query, so that the source only returns that country’s rows. What should you configure?',options:['A What-if parameter','A field parameter','A query parameter, with the Country column bound to it by using Bind to parameter (a dynamic M query parameter)','A calculation group'],answer:2,key:'C',why:'Dynamic M query parameters bind a model column to an M parameter, so slicer selections are injected into the DirectQuery source query.'},
{n:8,d:'P',type:'yn',stem:'For each statement about data profiling in Power Query, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Column distribution shows the number of distinct and unique values in each column.',a:true},{t:'By default, column quality and column distribution are calculated from every row in the table.',a:false},{t:'Selecting an Error cell shows the error’s reason and message.',a:true}],key:'Yes, No, Yes',why:'Profiling uses the top 1,000 rows unless you change it. Selecting an Error cell shows the error details below the preview.'},
{n:9,d:'P',type:'single',stem:'An incremental refresh policy refreshes the last 30 days. Most of those days rarely change, and you want only partitions whose rows changed to be refreshed. The table has a LastUpdated column. What should you configure?',options:['Turn on Detect data changes and select the LastUpdated column.','Turn on Only refresh complete days.','Reduce the refresh window to 7 days.','Clear Include in report refresh.'],answer:0,key:'A',why:'Detect data changes checks the maximum LastUpdated value per partition and refreshes only partitions where it changed. Only refresh complete days controls whether the current day is included.'},
{n:10,d:'M',type:'single',stem:'A map visual places “Paris” in Texas instead of France. What should you do?',options:['Change the City column’s data type to Text.','Set the City column’s data category to City, and give the map more context, such as a Country field or a combined “City, Country” column categorised as Place.','Replace the map with a filled map.','Set Sort by column on City.'],answer:1,key:'B',why:'Data categories and extra geographic context help Bing geocode ambiguous names correctly.'},
{n:11,d:'M',type:'blanks',stem:'A Budget table has a YearMonth column but no relationship to the Date table, which also has a YearMonth column. Complete the measure so that Budget responds to Date filters.',code:`Budget Amount =
CALCULATE (
    SUM ( Budget[Amount] ),
    [Blank 1] ( VALUES ( 'Date'[YearMonth] ), [Blank 2] )
)`,blanks:[{options:['TREATAS','USERELATIONSHIP','CROSSFILTER'],a:0},{options:['Budget[YearMonth]',"'Date'[Date]",'Budget[Amount]'],a:0}],key:'TREATAS, Budget[YearMonth]',why:'TREATAS applies the selected YearMonth values to Budget[YearMonth], acting as a virtual relationship. USERELATIONSHIP and CROSSFILTER need a physical relationship.'},
{n:12,d:'M',type:'single',code:true,stem:'The Sales table has one row per order line, and an order can have many lines. Which measure returns the number of orders?',options:['COUNTROWS ( Sales )','COUNT ( Sales[OrderID] )','DISTINCTCOUNT ( Sales[OrderID] )','SUM ( Sales[Quantity] )'],answer:2,key:'C',why:'Each OrderID repeats once per line, so only a distinct count returns the number of orders.'},
{n:13,d:'M',type:'blanks',stem:'Complete the measure so it returns sales of products that are red or large (or both).',code:`Red or Large Sales =
CALCULATE (
    [Sales],
    FILTER (
        ALL ( Product[Color], Product[Size] ),

    )
)`,blanks:[{options:['||','&&',','],a:0}],key:'||',why:'An OR across two columns needs a FILTER over both columns with the || operator. Separate filter arguments in CALCULATE are combined with AND.'},
{n:14,d:'M',type:'single',code:true,stem:'You need quarter-to-date sales. Which measure should you use?',options:["TOTALQTD ( [Sales], 'Date'[Date] )","TOTALYTD ( [Sales], 'Date'[Date], \"03-31\" )","CALCULATE ( [Sales], PREVIOUSQUARTER ( 'Date'[Date] ) )","CALCULATE ( [Sales], DATESMTD ( 'Date'[Date] ) )"],answer:0,key:'A',why:'TOTALQTD accumulates from the start of the quarter to the last date in context. PREVIOUSQUARTER returns the whole previous quarter.'},
{n:15,d:'M',type:'single',code:true,stem:'Managers want the delivery time that 90% of orders meet or beat. Which expression should you use?',options:['PERCENTILE.INC ( Orders[DeliveryDays], 0.9 )','PERCENTILE.INC ( Orders[DeliveryDays], 90 )','MEDIAN ( Orders[DeliveryDays] )','MAX ( Orders[DeliveryDays] ) * 0.9'],answer:0,key:'A',why:'PERCENTILE.INC takes k as a fraction between 0 and 1, so 0.9 returns the 90th percentile.'},
{n:16,d:'M',type:'single',code:true,stem:'A Balance table has one row per account per day. [Balance] = SUM ( Balance[Amount] ). A card must show the average daily balance (across all accounts) for whatever period is selected. Which measure should you use?',options:['AVERAGE ( Balance[Amount] )',"AVERAGEX ( VALUES ( 'Date'[Date] ), [Balance] )",'DIVIDE ( [Balance], 30 )',"CALCULATE ( [Balance], LASTDATE ( 'Date'[Date] ) )"],answer:1,key:'B',why:'AVERAGEX over dates totals all accounts for each day, then averages the daily totals. AVERAGE would average individual account rows instead.'},
{n:17,d:'M',type:'blanks',stem:'A YoY % calculation item must leave the [Margin %] measure unchanged, because a year-over-year change of a percentage isn’t wanted. Complete the calculation item.',code:`YoY % =
IF (
    [Blank 1] ( [Margin %] ),
    SELECTEDMEASURE (),
    VAR PY = CALCULATE ( SELECTEDMEASURE (), SAMEPERIODLASTYEAR ( 'Date'[Date] ) )
    RETURN DIVIDE ( SELECTEDMEASURE () - PY, PY )
)`,blanks:[{options:['ISSELECTEDMEASURE','SELECTEDVALUE','ISFILTERED'],a:0}],key:'ISSELECTEDMEASURE',why:'ISSELECTEDMEASURE returns TRUE when the measure in context is one of those listed, so the item can skip it.'},
{n:18,d:'M',type:'single',code:true,stem:'This measure is slow: Online Sales = CALCULATE ( [Sales], FILTER ( Sales, Sales[Channel] = "Online" ) ). Which rewrite is faster and returns the same result, including when users filter Channel with a slicer?',options:['CALCULATE ( [Sales], KEEPFILTERS ( Sales[Channel] = "Online" ) )','CALCULATE ( [Sales], Sales[Channel] = "Online" )','CALCULATE ( [Sales], FILTER ( ALL ( Sales ), Sales[Channel] = "Online" ) )','SUMX ( FILTER ( Sales, Sales[Channel] = "Online" ), Sales[Amount] )'],answer:0,key:'A',why:'A column predicate is faster than filtering the whole table. KEEPFILTERS keeps the intersection with any Channel slicer, just as FILTER ( Sales, … ) did. A plain column predicate without KEEPFILTERS is fast too, but it overrides a Channel slicer.'},
{n:19,d:'V',type:'match',stem:'Match each requirement to the most suitable visual. Each visual may be used once or not at all.',hint:'Choose a visual for each requirement.',items:[{t:'Show how many opportunities remain at each stage of a sales pipeline.',a:1},{t:'Show how the sales ranking of five brands changes month by month.',a:2},{t:'Show part-to-whole for 40 product categories in a nested layout.',a:3},{t:'Show daily revenue over three years.',a:0}],choices:['Line chart','Funnel chart','Ribbon chart','Treemap','Gauge'],key:'1-B, 2-C, 3-D, 4-A',why:'Funnels show stage drop-off, ribbon charts show rank changes, treemaps show many parts of a whole, and line charts show long time series.'},
{n:20,d:'V',type:'single',stem:'A matrix shows sales by month, but months with no sales disappear. Users must see every month, even when it’s empty. What should you do?',options:['Replace blanks with zero in Power Query.','Turn on Show items with no data for the Month field.','Sort the matrix by Month.','Turn off row subtotals.'],answer:1,key:'B',why:'Show items with no data displays dimension members even when the measure is blank.'},
{n:21,d:'V',type:'single',stem:'A chart title must read “Sales for <selected region>”, or “Sales for all regions” when nothing is selected. What should you do?',options:['Create a measure that builds the text with SELECTEDVALUE, then set the visual’s title text with conditional formatting (fx) based on that measure.','Add Region to the visual’s Legend well.','Turn on Personalize visuals.','Create one bookmark per region.'],answer:0,key:'A',why:'Titles accept field-value conditional formatting, so a measure can build a dynamic title.'},
{n:22,d:'V',type:'single',stem:'A bar chart must show only the 10 products with the highest sales, and the list must update when slicers change. What should you do?',options:['Sort the chart by Sales and reduce its height.','Add a visual-level filter on Product with the Top N filter type: top 10 by Sales.','Create a calculated table with TOPN.','Use a page-level basic filter that selects 10 products.'],answer:1,key:'B',why:'A Top N visual filter re-evaluates with the current filter context. A calculated table is static after refresh.'},
{n:23,d:'V',type:'blanks',stem:'In a table visual by month, add a visual calculation that shows the change from the previous month.',code:`Change vs previous = [Sales] - [Blank 1] ( [Sales] )`,blanks:[{options:['PREVIOUS','RUNNINGSUM','FIRST'],a:0}],key:'PREVIOUS',why:'PREVIOUS returns the value from the previous row on the visual’s axis.'},
{n:24,d:'V',type:'single',stem:'Report readers want to save their own filtered views of a published report and return to them later, without edit permission. What should they use?',options:['Personal bookmarks in the Power BI service','Report bookmarks created by the author','Sync slicers','Export to PDF'],answer:0,key:'A',why:'Personal bookmarks are saved per user in the service and don’t need edit rights.'},
{n:25,d:'V',type:'single',stem:'A Customer Details drillthrough page uses Customer[Name] as its drillthrough field. When users right-click a bar in a Sales by Region chart, Drill through doesn’t appear. What is the most likely cause?',options:['The drillthrough page is hidden.','The bar chart doesn’t include Customer[Name], so there is no customer to drill through on.','Keep all filters is turned off.','The report has no back button.'],answer:1,key:'B',why:'Drillthrough appears only when the selected data point carries the drillthrough field. A region-level bar doesn’t identify a customer.'},
{n:26,d:'V',type:'yn',stem:'For each statement about automatic page refresh, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'If the capacity’s minimum refresh interval is 30 minutes, a page set to refresh every 5 minutes refreshes every 30 minutes in the service.',a:true},{t:'Automatic page refresh re-imports data into an Import-mode semantic model.',a:false},{t:'Automatic page refresh can be used with DirectQuery sources.',a:true}],key:'Yes, No, Yes',why:'The admin minimum is enforced in the service. Automatic page refresh re-runs visual queries against DirectQuery sources; it doesn’t refresh imported data.'},
{n:27,d:'V',type:'single',stem:'A bar chart shows return rate by product category. You want Power BI to find the fields where the distribution for the Puzzles category differs most from the other categories. What should you do?',options:['Right-click the Puzzles bar and select Analyze > Find where this distribution is different.','Add a Key influencers visual with Return rate as the target.','Add an average line in the Analytics pane.','Turn on anomaly detection.'],answer:0,key:'A',why:'Find where this distribution is different compares the selected data point’s distribution with the rest and shows the most different fields.'},
{n:28,d:'S',type:'single',stem:'An Azure SQL Database is reachable only through a private endpoint in an Azure virtual network. The workspace is on a Fabric capacity. You need scheduled refresh without installing or managing gateway software on a virtual machine. What should you use?',options:['A personal mode gateway','A virtual network (VNet) data gateway','No gateway, because Azure SQL is a cloud source','Publish to web'],answer:1,key:'B',why:'A VNet data gateway is a managed service that reaches data sources inside an Azure virtual network, with no gateway software to install. A cloud source behind a private endpoint still needs a gateway.'},
{n:29,d:'S',type:'single',stem:'Sales staff must see a new app in their Power BI Apps list without searching for and installing it themselves. The tenant allows apps to be pushed to users. What should you do?',options:['Share the app link by email.','When publishing the app, select Install app automatically for the audience.','Publish the report to the web.','Add the users to the workspace as Viewers.'],answer:1,key:'B',why:'Installing the app automatically pushes it to the audience’s Apps list. Admins must allow this in the tenant settings.'},
{n:30,d:'S',type:'single',stem:'Every Monday, each of 20 regional managers must receive an email with the Sales page filtered to their own region. The workspace is on a Fabric capacity, and the model has no row-level security. What should you create?',options:['One standard subscription that includes all managers','A dynamic per-recipient subscription that maps each recipient to a Region value','A data alert on a dashboard tile','A paginated report published to the web'],answer:1,key:'B',why:'Dynamic per-recipient subscriptions use a table of recipients and filter values to send each person a differently filtered snapshot.'},
{n:31,d:'S',type:'yn',stem:'For each statement about scheduled refresh, choose Yes if the statement is true. Otherwise, choose No.',statements:[{t:'Power BI turns off a refresh schedule after four consecutive refresh failures.',a:true},{t:'Scheduled refresh is paused after two months in which no one visits reports or dashboards built on the semantic model.',a:true},{t:'A semantic model in a Pro workspace can be scheduled to refresh every 15 minutes.',a:false}],key:'Yes, Yes, No',why:'Both pauses are documented safeguards. Pro (shared capacity) allows eight scheduled refreshes a day, in 30-minute slots.'},
{n:32,d:'S',type:'goal',stem:'Solution: Install a standard mode on-premises data gateway, add a connection for the SQL Server and one for the SharePoint Online list, turn on Allow user’s cloud data sources to refresh through this gateway cluster, and map the semantic model to the gateway. Does this meet the goal?',options:['Yes','No'],answer:0,key:'Yes',why:'When one query mixes on-premises and cloud sources, the whole query runs on the gateway, so the cloud source must also be added to it, with cloud refresh allowed.'},
{n:33,d:'S',type:'goal',stem:'Solution: Configure scheduled refresh in the semantic model settings without a gateway, because SharePoint Online is a cloud source. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'The service can’t reach the on-premises SQL Server without a gateway.'},
{n:34,d:'S',type:'goal',stem:'Solution: Install a standard mode gateway and add only the SQL Server connection, leaving Allow user’s cloud data sources to refresh through this gateway cluster cleared. Does this meet the goal?',options:['Yes','No'],answer:1,key:'No',why:'A merged query that also reads SharePoint Online fails unless the cloud source is added to the gateway and cloud refresh is allowed.'},
{n:35,d:'S',type:'multi',pick:2,stem:'Which two items are required for the nightly refresh of store and online sales?',options:['A standard mode on-premises data gateway for the store sales SQL Server','A virtual network data gateway for the online orders database','A personal mode gateway on a marketing laptop','A gateway for the supplier REST API','Publish to web'],answer:[0,1],key:'A, B',why:'The on-premises database needs an on-premises gateway, and the private-endpoint Azure SQL Database needs a VNet data gateway. The public API needs neither.'},
{n:36,d:'P',type:'single',stem:'After you expand the product records, the ageRanges column holds a list in each row. How should you get one row per product per age range?',options:['Extract Values from the list, using a comma as the delimiter.','Expand the ageRanges column to new rows.','Transpose the table.','Unpivot Other Columns.'],answer:1,key:'B',why:'Expand to New Rows turns each list item into its own row. Extract Values would put all the values into one text cell.'},
{n:37,d:'M',type:'multi',pick:2,stem:'Category relates one-to-many to Product, and Product relates one-to-many to Sales. Which two formulas create a correct Category Sales calculated column on the Category table?',code:true,options:['Category Sales = SUM ( Sales[Amount] )','Category Sales = CALCULATE ( SUM ( Sales[Amount] ) )','Category Sales = SUMX ( RELATEDTABLE ( Sales ), Sales[Amount] )','Category Sales = RELATED ( Sales[Amount] )','Category Sales = SUMX ( Sales, Sales[Amount] )'],answer:[1,2],key:'B, C',why:'CALCULATE turns the current category row into a filter (context transition), and RELATEDTABLE follows the relationships to that category’s sales. Plain SUM or SUMX over Sales returns the grand total on every row.'},
{n:38,d:'V',type:'single',stem:'Which feature meets the regional managers’ requirement?',options:['Small multiples on the column chart, using Region','Six copies of the chart with page-level filters','A slicer synced across pages','Drillthrough to a region page'],answer:0,key:'A',why:'Small multiples repeat one visual for each value of a field, with a shared axis.'},
{n:39,d:'V',type:'single',stem:'How should you meet the alt text requirement?',options:['Type the alt text manually and update it each month.','Set the visual’s alt text with conditional formatting (fx), using a measure that builds the text from the selected store and its sales.','Turn on data labels.','Add a text box next to the chart.'],answer:1,key:'B',why:'Alt text accepts a measure, so screen readers announce text that changes with the selection.'},
{n:40,d:'S',type:'single',stem:'How should you meet the marketing team’s requirement?',options:['Publish the file from Power BI Desktop after every change.','In the service, get the report from the .pbix file in OneDrive for Business, so changes saved to the file sync to the service.','Install a gateway on the marketing laptop.','Export the report to PDF.'],answer:1,key:'B',why:'A report imported from OneDrive for Business stays connected to the file, and the service picks up saved changes, usually within an hour.'}
