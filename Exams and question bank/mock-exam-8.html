<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL-300 Mock Exam 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#15223A; --muted:#56647C; --rule:#D3DAE6;
  --accent:#1E5BBD; --accent-ink:#FFFFFF; --tint:#E5EDFA; --flag:#B97F00; --flag-tint:#FBF0D2;
  --good:#1D7448; --good-tint:#E1F2E8; --bad:#B3261E; --bad-tint:#FBE5E3; --zone:#ECF0F6; --code-bg:#EDF1F7;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1625; --surface:#152035; --ink:#E5EBF5; --muted:#9BA9C0; --rule:#2B3A57;
    --accent:#78A8F5; --accent-ink:#0E1625; --tint:#1C2D4D; --flag:#F2C14E; --flag-tint:#3A3018;
    --good:#5BC891; --good-tint:#16331F; --bad:#F2867B; --bad-tint:#3B1E1C; --zone:#1A2740; --code-bg:#1B2840;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1625; --surface:#152035; --ink:#E5EBF5; --muted:#9BA9C0; --rule:#2B3A57;
  --accent:#78A8F5; --accent-ink:#0E1625; --tint:#1C2D4D; --flag:#F2C14E; --flag-tint:#3A3018;
  --good:#5BC891; --good-tint:#16331F; --bad:#F2867B; --bad-tint:#3B1E1C; --zone:#1A2740; --code-bg:#1B2840;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:700;font-size:16px;line-height:1.25}
.brand span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.clock{text-align:right;line-height:1.2}
.clock span{display:block;font-size:12px;color:var(--muted)}
.clock strong{font-size:22px;font-variant-numeric:tabular-nums}
.clock.low strong{color:var(--flag)}

/* Layout */
.layout{max-width:1180px;margin:0 auto;padding:28px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.main{min-width:0;max-width:760px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:20px}
  .side{position:static}
}

/* Typography */
h1{font-size:clamp(38px,6vw,60px);line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.25;margin:0 0 10px}
h3{font-size:18px;margin:22px 0 8px}
.lead{font-size:19px;color:var(--muted);margin:0 0 24px;max-width:60ch}
p{margin:0 0 14px}

/* Buttons */
.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 20px;border-radius:9px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:14px;padding:7px 12px;min-height:36px}
.btn.quiet{border-color:var(--rule);color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:28px}
.actions .spacer{flex:1}

/* Intro */
.rules{list-style:none;padding:0;margin:0 0 26px;border-top:1px solid var(--rule)}
.rules li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:150px 1fr;gap:16px}
.rules b{display:block}
@media (max-width:560px){.rules li{grid-template-columns:1fr;gap:2px}}
fieldset{border:0;padding:0;margin:0}
.mode legend{font-weight:700;margin-bottom:8px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.choice input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.choice small{display:block;color:var(--muted);font-size:15px}

/* Question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.qnum{font-weight:700;font-size:15px;color:var(--muted);margin:0}
.flagbtn{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-tint);color:var(--ink)}
.hint{font-size:15px;color:var(--muted);font-style:italic;margin:0 0 12px}
.stem{font-size:19px;line-height:1.6;margin-bottom:18px}
.opts{margin:0}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:13px 16px;margin:10px 0;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:disabled){cursor:not-allowed;opacity:.55}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.bub.sq{border-radius:8px}
.opt:has(input:checked) .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.otext{padding-top:2px}
.mono{font-family:var(--mono);font-size:14.5px;line-height:1.55;word-break:break-word}
pre.code{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 18px;white-space:pre}
mark.blank{background:var(--flag-tint);color:var(--ink);border:1px dashed var(--flag);border-radius:4px;padding:0 3px}
.pick{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;margin:10px 0}
.pick label{font-weight:700;font-size:15px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:9px;padding:10px 12px;width:100%;min-height:46px}
@media (max-width:560px){.pick{grid-template-columns:1fr;gap:4px}}
.actionlist{list-style:none;padding:0;margin:0 0 16px}
.actionlist li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.actionlist li:last-child{border-bottom:0}
.actionlist b{flex:none;width:22px}
.yn{padding:12px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.yn p{margin:0}
.ynopts{display:flex;gap:8px}
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:42px;padding:6px 14px;border:1.5px solid var(--rule);border-radius:999px;cursor:pointer;font-weight:700;background:var(--surface)}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.yn{grid-template-columns:1fr}}
.note{font-size:15px;color:var(--muted);margin-top:14px}

/* Context panels */
.panel{border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);padding:16px 18px;margin-bottom:24px}
.panel.goal{border-left:5px solid var(--flag)}
.panel h2{font-size:18px;margin-bottom:6px}
details.panel summary{font-weight:700;cursor:pointer;font-size:18px}
details.panel[open] summary{margin-bottom:10px}
.panel ul{padding-left:20px;margin:0 0 12px}
.panel li{margin:4px 0}
.exhibit{width:100%;height:auto;display:block;margin:6px 0 14px}
.exhibit text{font-family:var(--font)}
.x-title{font-weight:700;font-size:15px;fill:var(--ink)}
.x-zone{fill:var(--zone);stroke:var(--rule)}
.x-box{fill:var(--surface);stroke:var(--muted);stroke-width:1.25}
.x-main{fill:var(--tint);stroke:var(--accent);stroke-width:2}
.x-n{font-weight:700;font-size:13px;fill:var(--ink)}
.x-s{font-size:11.5px;fill:var(--muted)}
.x-zn{font-size:11.5px;font-weight:700;fill:var(--muted)}
.x-line{fill:none;stroke:var(--muted);stroke-width:1.25}
.x-ah{fill:var(--muted)}

/* Answer sheet */
.sheet{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:18px}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet .sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.grp{margin:14px 0 0}
.grp p{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.cell{aspect-ratio:1;width:100%;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell.part{background:linear-gradient(to top,var(--ink) 50%,transparent 50%);color:var(--ink)}
.cell.part span{background:var(--surface);border-radius:4px;padding:0 2px;line-height:1.1}
.cell.ans{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cell.flag{box-shadow:0 0 0 3px var(--flag)}
.cell.cur{outline:2px solid var(--accent);outline-offset:3px}
.cell:disabled{cursor:default;opacity:.5;border-style:dashed}
.cell.ok{background:var(--good);border-color:var(--good);color:var(--surface);opacity:1;border-style:solid}
.cell.half{background:var(--flag);border-color:var(--flag);color:var(--surface);opacity:1;border-style:solid}
.cell.no{background:var(--bad-tint);border-color:var(--bad);color:var(--bad);opacity:1;border-style:solid}
.legend{list-style:none;padding:0;margin:16px 0 0;font-size:13px;color:var(--muted);display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.dot.ans{background:var(--ink);border-color:var(--ink)}
.dot.flag{box-shadow:0 0 0 2.5px var(--flag)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.half{background:var(--flag);border-color:var(--flag)}
.dot.no{background:var(--bad-tint);border-color:var(--bad)}
.sheet .btn{width:100%;margin-top:16px}

/* Results */
.score{font-size:clamp(72px,14vw,128px);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0 10px}
.score small{font-size:.38em;color:var(--muted);font-weight:400;letter-spacing:0}
.verdict{font-size:19px;margin:0 0 6px}
.verdict.pass{color:var(--good)}
.verdict.close{color:var(--flag)}
.verdict.fail{color:var(--bad)}
.domains{margin:28px 0 0;border-top:1px solid var(--rule)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.drow b{font-size:16px}
.drow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.track{grid-column:1 / -1;height:10px;border-radius:999px;background:var(--zone);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px}
.fill.low{background:var(--bad)}

/* Review */
.filter{display:flex;gap:10px;align-items:center;margin:8px 0 18px;font-size:16px;cursor:pointer}
.filter input{width:18px;height:18px;accent-color:var(--accent)}
.rcard{border:1.5px solid var(--rule);border-left-width:6px;border-radius:12px;background:var(--surface);padding:16px 18px;margin:0 0 16px}
.rcard.ok{border-left-color:var(--good)}
.rcard.half{border-left-color:var(--flag)}
.rcard.no{border-left-color:var(--bad)}
.rtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.rtop b{font-size:15px;color:var(--muted)}
.tag{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.ok{background:var(--good-tint);color:var(--good)}
.tag.half{background:var(--flag-tint);color:var(--ink)}
.tag.no{background:var(--bad-tint);color:var(--bad)}
.rstem{font-size:16.5px;margin:0 0 12px}
.ans-grid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;font-size:15.5px;margin:0 0 10px}
.ans-grid dt{color:var(--muted)}
.ans-grid dd{margin:0;font-weight:700}
@media (max-width:560px){.ans-grid{grid-template-columns:1fr;gap:0}.ans-grid dd{margin-bottom:6px}}
.why{font-size:15.5px;margin:0;padding-top:10px;border-top:1px solid var(--rule)}

/* Dialog */
dialog{border:1.5px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink);max-width:460px;width:calc(100% - 40px);padding:24px}
dialog::backdrop{background:rgba(8,14,26,.5)}
dialog h2{font-size:21px}
dialog .actions{margin-top:20px;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.opt,.pill,.cell{transition:background-color .12s,border-color .12s}}
.pick.wide{grid-template-columns:1fr;gap:6px}
.pick.wide label{font-weight:400;font-size:16px}
.xcap{font-size:14px;color:var(--muted);margin:0 0 6px}
.xwrap{overflow-x:auto;margin:0 0 18px}
.xt{border-collapse:collapse;font-family:var(--mono);font-size:14px}
.xt td{border:1px solid var(--rule);padding:6px 12px;background:var(--surface)}
.xt tr:first-child td{background:var(--zone);font-weight:600}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:14px}
.foot p{max-width:70ch;border-top:1px solid var(--rule);padding-top:16px}
.brand a{color:var(--accent)}
</style>
</head>

</div></header>
<div id="app"></div>
<footer class="foot"><p>Unofficial practice material, not affiliated with or endorsed by Microsoft. Written against the PL-300 skills measured as of April 20, 2026, and last reviewed on 9 November 2026.</p></footer>
<dialog id="dlg"><h2 id="dlg-t"></h2><p id="dlg-p"></p><div class="actions"><button class="btn quiet" id="dlg-no" type="button">Cancel</button><button class="btn primary" id="dlg-ok" type="button">OK</button></div></dialog>

<script>
const MINUTES = 80, PASS = 30, L = 'ABCDE';
const DOM = {P:'Prepare the data', M:'Model the data', V:'Visualize and analyze the data', S:'Manage and secure Power BI'};
const SECTIONS = [
  {name:'Section 1', label:'Questions 1–31', from:1, to:31, free:true},
  {name:'Goal series', label:'Questions 32–34', from:32, to:34, free:false},
  {name:'Case study', label:'Questions 35–40', from:35, to:40, free:true}
];

const EXAM = {num:8, shuffle:true, caseTitle:'Alpine Ski House', next:'Mock 9'};

const AS_SVG = flowSVG('asa', 'Alpine Ski House: live lift data, nightly ticket sales', [
  ['Lift-gate scans', 'Azure SQL Database (public)', 'New rows every few seconds'],
  ['Ticket sales', 'POS on SQL Server, on-premises', 'Refreshed nightly'],
  ['Weather', 'Public REST API (JSON)', 'Nested list of hourly readings']
], ['Power BI workspace', 'Fabric F64 capacity', 'Labelled semantic model'], [
  ['Operations', 'Lift queues within 2 minutes'],
  ['Marketing', 'What drives daily visitors'],
  ['Resort managers', 'Build reports from the model']
]);

const GOAL = 'Ski instructors have Power BI Free licences. They must be able to view a schedule report on their phones. The report is internal and must not be visible to anyone outside the company.';

const CASE = `<p><b>Overview.</b> Alpine Ski House runs four ski resorts. Its Power BI workspace runs on a Fabric F64 capacity.</p>
${AS_SVG}
<h3>Existing environment</h3><ul>
<li>Lift-gate scans are written to an Azure SQL Database every few seconds. Each scan has a PassID, a GateID and a ScanTime. A pass can be scanned many times a day.</li>
<li>Ticket sales come from a point-of-sale database on SQL Server in the head office.</li>
<li>Weather comes from a public REST API. Each day’s record contains a list of hourly readings.</li>
<li>A Visitors measure is defined as [Unique Visitors] = DISTINCTCOUNT ( LiftScans[PassID] ).</li></ul>
<h3>Requirements</h3><ul>
<li>Operations must see lift queues within two minutes of new scans, without waiting for a refresh.</li>
<li>Weather must be loaded with one row per hour.</li>
<li>A measure must count visitor-days: each pass counts once for every day it is used.</li>
<li>Ticket sales must refresh nightly.</li>
<li>The semantic model is labelled Confidential, and reports that resort managers create from it must automatically get the same label.</li>
<li>Marketing wants to know which factors (weather, day of week, school holidays) most increase daily visitors.</li></ul>`;

const Q = [
{n:1,d:'P',type:'single',stem:'You built a report on an Excel file in a OneDrive folder that is synced to your PC, using the path C:\\Users\\you\\OneDrive - Contoso\\Targets.xlsx. After publishing, scheduled refresh says a gateway is required. How can you refresh without a gateway?',options:['Install a personal gateway.','Reconnect the query to the file’s OneDrive or SharePoint web address (for example, with the SharePoint folder or Web connector) instead of the local synced path.','Change the privacy level to Public.','Turn off Include in report refresh.'],answer:1,key:'B',why:'A local path, even a synced one, is an on-premises file to the service. Connecting through the cloud address makes it a cloud source.'},
{n:2,d:'P',type:'single',stem:'A query parameter named Environment should only accept Dev, Test or Prod, and people changing it in the service should pick from a list. How should you configure the parameter?',options:['Set Suggested Values to List of values and enter Dev, Test and Prod.','Set the type to Any.','Create a What-if parameter.','Create a field parameter.'],answer:0,key:'A',why:'A list of suggested values gives a drop-down in Desktop and in the semantic model settings in the service.'},
{n:3,d:'P',type:'single',stem:'A small Azure SQL table changes every few seconds. A report must show its current state, with less than a minute of delay, while the page is open. Which storage mode should you use for the table?',options:['Import, with eight scheduled refreshes a day','DirectQuery, combined with automatic page refresh','Dual','Import, with incremental refresh'],answer:1,key:'B',why:'DirectQuery queries the source live, and automatic page refresh re-runs the visuals on an interval.'},
{n:4,d:'P',type:'single',stem:'A Temperature column has nulls when a sensor was offline. Average temperature must ignore those periods instead of treating them as 0 °C. What should you do?',options:['Replace the nulls with 0.','Leave the nulls; they load as blanks, which AVERAGE ignores.','Remove the rows with nulls from the whole table.','Use Fill Down.'],answer:1,key:'B',why:'Blank values are excluded from averages. Zeros would drag the average down, and Fill Down would invent readings.'},
{n:5,d:'P',type:'single',stem:'An Excel source keeps breaking because its owner renames the worksheet, and the query’s Navigation step refers to the sheet name. What makes the query more stable?',options:['Format the data as a named Excel table and connect to the table instead of the sheet.','Turn off type detection.','Use Fill Down.','Change the privacy level.'],answer:0,key:'A',why:'A named table keeps its name and range when the sheet is renamed or when rows are added.'},
{n:6,d:'P',type:'blanks',stem:'Complete the custom column so it returns the number of minutes between ScanIn and ScanOut, including whole hours (90 for an hour and a half).',code:`= Table.AddColumn ( Source, "Minutes", each [Blank 1] ( [ScanOut] - [ScanIn] ) )`,blanks:[{options:['Duration.TotalMinutes','Duration.Minutes','DateTime.Time'],a:0}],key:'Duration.TotalMinutes',why:'Subtracting two date-time values gives a duration. Duration.TotalMinutes converts all of it to minutes; Duration.Minutes returns only the minutes component (30 for 1:30).'},
{n:7,d:'P',type:'seq',steps:2,stem:'An Excel report export starts with three title rows, as in the exhibit. The column names are in row 4. Which two actions should you perform, in order?',exhibit:tableHTML('Exhibit: the sheet as it arrives in Power Query (first six rows)',[['Column1','Column2','Column3'],['Alpine Ski House','',''],['Ticket sales report','',''],['Season 2026','',''],['Date','Resort','Tickets'],['2026-12-01','Summit','1450']]),options:['Remove Top Rows: 3','Use First Row as Headers','Transpose','Remove Bottom Rows: 3','Fill Down'],answers:[[0,1]],key:'A, B',why:'Remove the three title rows so the column names become the first row, then promote them to headers.'},

const KEY = 'pl300-mock' + EXAM.num + '-v1';
rebalance();


/* ---------- answer-position balancing (opt-in per exam; deterministic) ---------- */
function rebalance(){
  if (!EXAM.shuffle) return;
  const pattern = [2,0,3,1,1,3,0,2,3,1,2,0,0,2,1,3];
  let c = EXAM.num * 5;
  Q.forEach(q => {
    if (q.type === 'single' && q.options.length >= 3){
      const k = q.options.length, target = pattern[c++ % pattern.length] % k;
      const right = q.options[q.answer];
      const rest = q.options.filter((o,i) => i !== q.answer);
      rest.splice(target, 0, right);
      q.options = rest; q.answer = target; q.key = L[target];
    } else if (q.type === 'multi'){
      const k = q.options.length, r = (q.n + EXAM.num) % k;
      q.options = q.options.map((o,i) => q.options[(i + r) % k]);
      q.answer = q.answer.map(j => (j - r + k) % k).sort((a,b) => a-b);
      q.key = q.answer.map(i => L[i]).join(', ');
    }
  });
}

/* ---------- exhibit diagram helper (sources -> workspace -> audiences) ---------- */
function flowSVG(id, title, sources, center, outs){
  const top = 64, sh = 72, oh = 56, gap = 16;
  const sTot = sources.length*sh + (sources.length-1)*gap;
  const oTot = outs.length*oh + (outs.length-1)*gap;
  const span = Math.max(sTot, oTot, 72);
  const mid = top + span/2, sTop = top + (span-sTot)/2, oTop = top + (span-oTot)/2;
  const t = (x,y,cls,s) => `<text x="${x}" y="${y}" class="${cls}">${esc(s)}</text>`;
  let h = `<svg class="exhibit" viewBox="0 0 760 ${top+span+24}" role="img" aria-label="${esc(title)}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="x-ah"/></marker></defs>${t(24,30,'x-title',title)}`;
  const sy = [];
  sources.forEach((s,i) => { const y = sTop + i*(sh+gap); sy.push(y+36); h += `<rect x="24" y="${y}" width="224" height="${sh}" rx="8" class="x-box"/>` + t(40,y+24,'x-n',s[0]) + t(40,y+40,'x-s',s[1]) + t(40,y+56,'x-s',s[2]); });
  const cy = mid - 36;
  h += `<rect x="290" y="${cy}" width="180" height="72" rx="8" class="x-main"/>` + t(306,cy+24,'x-n',center[0]) + t(306,cy+40,'x-s',center[1]) + t(306,cy+56,'x-s',center[2]);
  const oy = [];
  outs.forEach((o,i) => { const y = oTop + i*(oh+gap); oy.push(y+28); h += `<rect x="496" y="${y}" width="240" height="${oh}" rx="8" class="x-box"/>` + t(512,y+24,'x-n',o[0]) + t(512,y+40,'x-s',o[1]); });
  h += `<g class="x-line">`;
  sy.forEach(y => { h += `<path d="M248 ${y}H270"/>`; });
  h += `<path d="M270 ${Math.min(...sy, mid)}V${Math.max(...sy, mid)}"/><path d="M270 ${mid}H290" marker-end="url(#${id})"/><path d="M470 ${mid}H483"/><path d="M483 ${Math.min(...oy, mid)}V${Math.max(...oy, mid)}"/>`;
  oy.forEach(y => { h += `<path d="M483 ${y}H496" marker-end="url(#${id})"/>`; });
  return h + `</g></svg>`;
}
function tableHTML(caption, rows){
  return `<p class="xcap">${esc(caption)}</p><div class="xwrap"><table class="xt">${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}

/* ---------- state ---------- */
function fresh(mode){ return {screen:'intro', mode:mode||'strict', answers:{}, flags:{}, n:1, sec:0, locked:{}, endAt:null, startedAt:null, finishedAt:null, timedOut:false, onlyMissed:false}; }
function load(){ try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load() || fresh();

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const qOf = n => Q[n-1];
const secOf = n => SECTIONS.findIndex(s => n >= s.from && n <= s.to);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function parts(q){ return q.type==='seq' ? q.steps : q.type==='blanks' ? q.blanks.length : q.type==='match' ? q.items.length : q.statements.length; }
function status(q){
  const a = S.answers[q.n];
  if (a === undefined || a === null) return 0;
  if (!Array.isArray(a)) return 2;
  if (q.type === 'multi') return a.length === q.pick ? 2 : (a.length ? 1 : 0);
  const f = a.filter(x => x !== null && x !== undefined).length;
  return f === parts(q) ? 2 : (f ? 1 : 0);
}
function grade(q){
  const a = S.answers[q.n];
  let full = false, part = 0;
  if (q.type === 'single' || q.type === 'goal'){ full = a === q.answer; part = full ? 1 : 0; }
  else if (q.type === 'multi'){
    const arr = a || []; const right = arr.filter(x => q.answer.includes(x)).length; const wrong = arr.length - right;
    full = right === q.answer.length && wrong === 0; part = Math.max(0, right - wrong) / q.answer.length;
  } else if (q.type === 'seq'){
    const arr = a || [];
    part = Math.max(...q.answers.map(alt => alt.filter((x,i) => arr[i] === x).length / alt.length));
    full = part === 1;
  } else if (q.type === 'blanks'){
    const arr = a || []; part = q.blanks.filter((b,i) => arr[i] === b.a).length / q.blanks.length; full = part === 1;
  } else if (q.type === 'match'){
    const arr = a || []; part = q.items.filter((s,i) => arr[i] === s.a).length / q.items.length; full = part === 1;
  } else if (q.type === 'yn'){
    const arr = a || []; part = q.statements.filter((s,i) => arr[i] === s.a).length / q.statements.length; full = part === 1;
  }
  const pts = S.mode === 'partial' ? part : (full ? 1 : 0);
  return {full, part, pts, answered: status(q) > 0};
}
function userText(q){
  const a = S.answers[q.n];
  if (status(q) === 0) return 'No answer';
  const dash = '–';
  if (q.type === 'single') return `${L[a]}. ${q.options[a]}`;
  if (q.type === 'goal') return q.options[a];
  if (q.type === 'multi') return a.slice().sort((x,y)=>x-y).map(i => L[i]).join(', ');
  if (q.type === 'seq') return a.map(x => x === null || x === undefined ? dash : L[x]).join(', ');
  if (q.type === 'blanks') return a.map((x,i) => x === null || x === undefined ? dash : q.blanks[i].options[x]).join(', ');
  if (q.type === 'match') return a.map((x,i) => `${i+1}-${x === null || x === undefined ? dash : L[x]}`).join(', ');
  if (q.type === 'yn') return a.map(x => x === null || x === undefined ? dash : (x ? 'Yes' : 'No')).join(', ');
  return '';
}
function fmtTime(ms){ const t = Math.max(0, Math.round(ms/1000)); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; }
function canGo(n){
  if (S.screen !== 'exam' && S.screen !== 'secreview') return false;
  const s = secOf(n); return s === S.sec && SECTIONS[s].free;
}

/* ---------- answer sheet ---------- */
function sheet(mode){
  let h = `<aside class="side"><div class="sheet"><h2>Answer sheet</h2>`;
  h += mode === 'results' ? `<p class="sub">Select a question to see its explanation.</p>` : mode === 'intro' ? `<p class="sub">40 questions in three sections, taken in order.</p>` : `<p class="sub">${Q.filter(q => status(q) === 2).length} of 40 answered</p>`;
  SECTIONS.forEach((sec, si) => {
    h += `<div class="grp"><p>${sec.name}: ${sec.label.toLowerCase()}</p><div class="cells">`;
    for (let n = sec.from; n <= sec.to; n++){
      const q = qOf(n); let cls = 'cell', dis = false, lab = `Question ${n}`;
      if (mode === 'results'){
        const g = grade(q); cls += g.full ? ' ok' : (g.part > 0 ? ' half' : ' no');
        lab += g.full ? ', correct' : (g.part > 0 ? ', partly right' : ', not right');
      } else {
        const st = status(q); if (st === 2) { cls += ' ans'; lab += ', answered'; } else if (st === 1) { cls += ' part'; lab += ', partly answered'; }
        if (S.flags[n]) { cls += ' flag'; lab += ', flagged'; }
        if (mode === 'exam' && S.screen === 'exam' && n === S.n) { cls += ' cur'; lab += ', current'; }
        dis = mode === 'intro' || !canGo(n);
      }
      const act = mode === 'results' ? 'jump' : 'goto';
      h += `<button type="button" class="${cls}" data-act="${act}" data-n="${n}" aria-label="${lab}" ${dis ? 'disabled' : ''}><span>${n}</span></button>`;
    }
    h += `</div></div>`;
  });
  if (mode === 'results'){
    h += `<ul class="legend"><li><span class="dot ok"></span>Correct</li><li><span class="dot half"></span>Partly right</li><li><span class="dot no"></span>Not right or not answered</li></ul>`;
  } else {
    h += `<ul class="legend"><li><span class="dot ans"></span>Answered</li><li><span class="dot flag"></span>Flagged for review</li><li><span class="dot"></span>Not answered yet</li></ul>`;
    if (mode === 'exam') h += `<button type="button" class="btn quiet small" data-act="finish">Finish exam now</button>`;
  }
  return h + `</div></aside>`;
}

/* ---------- screens ---------- */

  const saved = S.startedAt && !S.finishedAt;
  let h = `<div class="layout"><main class="main">`;
  h += `<h1>Mock Exam ${EXAM.num}</h1><p class="lead">Microsoft PL-300 Power BI Data Analyst practice. 40 questions, 80 minutes, closed book. Aim for 30 or more.</p>`;
  h += `<ul class="rules">
    <li><div><b>Section 1</b>Questions 1–31</div><div>Move freely between questions and flag any you want to revisit. When you end the section, you can’t return to it.</div></li>
    <li><div><b>Goal series</b>Questions 32–34</div><div>The same goal with three different solutions. Each answer is final once you continue.</div></li>
    <li><div><b>Case study</b>Questions 35–40</div><div>Read the scenario, then answer six questions about it. Move freely within the case study, then finish the exam.</div></li>
    <li><div><b>Timer</b>80 minutes</div><div>The exam is submitted automatically when time runs out. Progress is saved in this browser if you close the page.</div></li>
  </ul>`;
  if (saved){
    h += `<p>You have an exam in progress with ${fmtTime(S.endAt - Date.now())} left.</p><div class="actions"><button class="btn primary" data-act="resume">Resume exam</button><button class="btn" data-act="restart">Start over</button></div>`;
  } else {
    h += `<fieldset class="mode"><legend>Scoring</legend>
      <label class="choice"><input type="radio" name="mode" value="strict" data-k="mode" ${S.mode !== 'partial' ? 'checked' : ''}><span>Strict<small>A multi-part question scores only when every part is right.</small></span></label>
      <label class="choice"><input type="radio" name="mode" value="partial" data-k="mode" ${S.mode === 'partial' ? 'checked' : ''}><span>Partial credit<small>Each correct part earns its share of the point, closer to how the live exam scores.</small></span></label>
    </fieldset><div class="actions"><button class="btn primary" data-act="start">Start exam</button></div>`;
  }
  return h + `</main>${sheet('intro')}</div>`;
}

function hint(q){
  return q.hint || {single:'Choose one answer.', goal:'Choose Yes or No. After you continue, you can’t return to this question.', multi:`Choose ${q.pick === 2 ? 'two' : 'three'} answers. Each correct answer presents part of the solution.`, seq:`Choose an action for each of the ${q.steps} steps, in order. Not every action is used.`, blanks:'Choose the correct option for each blank.', yn:'Answer each statement on its own.'}[q.type];
}

function body(q){
  const a = S.answers[q.n];
  if (q.type === 'single' || q.type === 'goal'){
    return `<fieldset class="opts"><legend class="sr">Answer options</legend>${q.options.map((o,i) => `<label class="opt"><input type="radio" id="q${q.n}-${i}" name="q${q.n}" value="${i}" data-k="single" ${a === i ? 'checked' : ''}><span class="bub" aria-hidden="true">${L[i]}</span><span class="otext${q.code ? ' mono' : ''}">${fmt(o)}</span></label>`).join('')}</fieldset>`;
  }
  if (q.type === 'multi'){
    const arr = a || [];
    return `<fieldset class="opts"><legend class="sr">Choose ${q.pick}</legend>${q.options.map((o,i) => { const on = arr.includes(i); const dis = !on && arr.length >= q.pick; return `<label class="opt"><input type="checkbox" id="q${q.n}-${i}" value="${i}" data-k="multi" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><span class="bub sq" aria-hidden="true">${L[i]}</span><span class="otext${q.code ? ' mono' : ''}">${fmt(o)}</span></label>`; }).join('')}</fieldset><p class="note">${arr.length} of ${q.pick} chosen.</p>`;
  }
  if (q.type === 'seq'){
    const arr = a || [];
    let h = `<ul class="actionlist">${q.options.map((o,i) => `<li><b>${L[i]}</b><span>${fmt(o)}</span></li>`).join('')}</ul>`;
    for (let j = 0; j < q.steps; j++){
      h += `<div class="pick"><label for="q${q.n}-p${j}">Step ${j+1}</label><select id="q${q.n}-p${j}" data-k="seq" data-j="${j}"><option value="">Choose an action</option>${q.options.map((o,i) => { const used = arr.includes(i) && arr[j] !== i; return `<option value="${i}" ${arr[j] === i ? 'selected' : ''} ${used ? 'disabled' : ''}>${L[i]}. ${esc(o)}</option>`; }).join('')}</select></div>`;
    }
    return h;
  }
  if (q.type === 'blanks'){
    const arr = a || [];
    let code = esc(q.code).replace(/\[Blank (\d)\]/g, '<mark class="blank">[Blank $1]</mark>');
    let h = `<pre class="code">${code}</pre>`;
    q.blanks.forEach((b,j) => {
      h += `<div class="pick"><label for="q${q.n}-b${j}">Blank ${j+1}</label><select id="q${q.n}-b${j}" data-k="blank" data-j="${j}"><option value="">Choose an option</option>${b.options.map((o,i) => `<option value="${i}" ${arr[j] === i ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    });
    return h;
  }
  if (q.type === 'match'){
    const arr = a || [];
    let h = `<ul class="actionlist">${q.choices.map((o,i) => `<li><b>${L[i]}</b><span>${fmt(o)}</span></li>`).join('')}</ul>`;
    q.items.forEach((it,j) => {
      h += `<div class="pick wide"><label for="q${q.n}-m${j}">${j+1}. ${fmt(it.t)}</label><select id="q${q.n}-m${j}" data-k="blank" data-j="${j}"><option value="">Choose an option</option>${q.choices.map((o,i) => `<option value="${i}" ${arr[j] === i ? 'selected' : ''}>${L[i]}. ${esc(o)}</option>`).join('')}</select></div>`;
    });
    return h;
  }
  if (q.type === 'yn'){
    const arr = a || [];
    return q.statements.map((s,j) => `<div class="yn" role="radiogroup" aria-label="Statement ${j+1}"><p>${j+1}. ${fmt(s.t)}</p><div class="ynopts"><label class="pill"><input type="radio" id="q${q.n}-s${j}-y" name="q${q.n}-s${j}" value="1" data-k="yn" data-j="${j}" ${arr[j] === true ? 'checked' : ''}>Yes</label><label class="pill"><input type="radio" id="q${q.n}-s${j}-n" name="q${q.n}-s${j}" value="0" data-k="yn" data-j="${j}" ${arr[j] === false ? 'checked' : ''}>No</label></div></div>`).join('');
  }
  return '';
}

function renderExam(){
  const q = qOf(S.n), sec = SECTIONS[S.sec];
  let h = `<div class="layout"><main class="main">`;
  if (sec.name === 'Goal series'){
    h += `<div class="panel goal"><h2>Goal series</h2><p>Each question presents the same goal with a different solution. Decide whether the solution meets the goal.</p><p style="margin:0"><b>Goal:</b> ${fmt(GOAL)}</p></div>`;
  }
  if (sec.name === 'Case study'){
    h += `<details class="panel" ${S.caseClosed ? '' : 'open'} id="casepanel"><summary>Case study: ${EXAM.caseTitle}</summary>${CASE}</details>`;
  }
  h += `<div class="qhead"><p class="qnum">Question ${q.n} of 40</p>${sec.free ? `<button type="button" class="flagbtn" data-act="flag" aria-pressed="${!!S.flags[q.n]}">${S.flags[q.n] ? 'Flagged for review' : 'Flag for review'}</button>` : ''}</div>`;
  h += `<p class="hint">${hint(q)}</p><div class="stem">${fmt(q.stem)}</div>${q.exhibit || ''}${body(q)}`;
  h += `<div class="actions">`;
  if (sec.free){
    h += `<button class="btn" data-act="prev" ${S.n === sec.from ? 'disabled' : ''}>Previous</button><span class="spacer"></span>`;
    h += S.n === sec.to ? `<button class="btn primary" data-act="secreview">Review ${sec.name === 'Case study' ? 'case study' : 'section'}</button>` : `<button class="btn primary" data-act="next">Next</button>`;
  } else {
    h += `<span class="spacer"></span><button class="btn primary" data-act="goalnext">Save answer and continue</button>`;
  }
  h += `</div></main>${sheet('exam')}</div>`;
  return h;
}

function renderSecReview(){
  const sec = SECTIONS[S.sec];
  const qs = Q.filter(q => q.n >= sec.from && q.n <= sec.to);
  const done = qs.filter(q => status(q) === 2).length;
  const unanswered = qs.filter(q => status(q) < 2).map(q => q.n);
  const flagged = qs.filter(q => S.flags[q.n]).map(q => q.n);
  const last = S.sec === SECTIONS.length - 1;
  let h = `<div class="layout"><main class="main"><h1 style="font-size:clamp(32px,5vw,44px)">Review ${sec.name === 'Case study' ? 'the case study' : sec.name}</h1>`;
  h += `<p class="lead">You have answered ${done} of ${qs.length} questions in this ${sec.name === 'Case study' ? 'case study' : 'section'}. Select any question on the answer sheet to return to it.</p>`;
  if (unanswered.length) h += `<p><b>Not fully answered:</b> ${unanswered.join(', ')}</p>`;
  if (flagged.length) h += `<p><b>Flagged for review:</b> ${flagged.join(', ')}</p>`;
  h += `<div class="actions"><button class="btn" data-act="goto" data-n="${sec.to}">Back to question ${sec.to}</button><span class="spacer"></span><button class="btn primary" data-act="endsec">${last ? 'Finish exam' : 'End section'}</button></div>`;
  return h + `</main>${sheet('exam')}</div>`;
}

function renderResults(){
  let total = 0; const per = {};
  Object.keys(DOM).forEach(k => per[k] = {got:0, of:0});
  Q.forEach(q => { const g = grade(q); total += g.pts; per[q.d].got += g.pts; per[q.d].of += 1; });
  const shown = S.mode === 'partial' ? (Math.round(total*10)/10).toFixed(1) : String(Math.round(total));
  const cls = total >= PASS ? 'pass' : total >= 26 ? 'close' : 'fail';
  const msg = total >= PASS ? 'On track. 30 or more is the target for exam day.' : total >= 26 ? 'Close. Drill your weakest domain below before the next mock.' : ('Below target. ' + (EXAM.next ? 'Redo the questions you missed before you take ' + EXAM.next + '.' : 'Redo the questions you missed and reread the cheat sheet before the exam.'));
  const used = S.finishedAt && S.startedAt ? fmtTime(Math.min(S.finishedAt, S.endAt) - S.startedAt) : '';
  let h = `<div class="layout"><main class="main"><h2>Your score</h2><div class="score">${shown}<small> / 40</small></div>`;
  h += `<p class="verdict ${cls}">${msg}</p><p style="color:var(--muted)">${S.mode === 'partial' ? 'Partial-credit scoring' : 'Strict scoring'}${used ? `, time used ${used}` : ''}.${S.timedOut ? ' Time ran out, so the exam was submitted automatically.' : ''}</p>`;
  h += `<div class="domains">`;
  Object.keys(DOM).forEach(k => {
    const p = per[k]; const pct = p.of ? p.got / p.of : 0;
    const g = S.mode === 'partial' ? (Math.round(p.got*10)/10).toFixed(1) : Math.round(p.got);
    h += `<div class="drow"><b>${DOM[k]}</b><span class="val">${g} / ${p.of}</span><div class="track" role="img" aria-label="${Math.round(pct*100)} percent"><div class="fill${pct < .75 ? ' low' : ''}" style="width:${Math.round(pct*100)}%"></div></div></div>`;
  });
  h += `</div><p class="note">Domains under 75% are marked in red; spend your next review session on those.</p>`;
  h += `<div class="actions"><button class="btn primary" data-act="review">Review answers</button><button class="btn" data-act="retake">Retake exam</button></div>`;
  return h + `</main>${sheet('results')}</div>`;
}

function renderReview(){
  let h = `<div class="layout"><main class="main"><h1 style="font-size:clamp(32px,5vw,44px)">Review answers</h1>`;
  h += `<label class="filter"><input type="checkbox" data-k="onlymissed" ${S.onlyMissed ? 'checked' : ''}>Show only questions you didn’t get fully right</label>`;
  Q.forEach(q => {
    const g = grade(q);
    if (S.onlyMissed && g.full) return;
    const c = g.full ? 'ok' : (g.part > 0 ? 'half' : 'no');
    const tag = g.full ? 'Correct' : !g.answered ? 'Not answered' : g.part > 0 ? 'Partly right' : 'Incorrect';
    h += `<article class="rcard ${c}" id="r${q.n}"><div class="rtop"><b>Question ${q.n}, ${DOM[q.d]}</b><span class="tag ${c}">${tag}</span></div>`;
    if (q.type === 'goal') h += `<p class="rstem" style="color:var(--muted)">Goal: ${fmt(GOAL)}</p>`;
    h += `<p class="rstem">${fmt(q.stem)}</p>${q.exhibit || ''}`;
    if (q.type === 'blanks') h += `<pre class="code">${esc(q.code).replace(/\[Blank (\d)\]/g, '<mark class="blank">[Blank $1]</mark>')}</pre>`;
    if (q.type === 'single' || q.type === 'multi' || q.type === 'seq') h += `<ul class="actionlist">${q.options.map((o,i) => `<li><b>${L[i]}</b><span class="${q.code ? 'mono' : ''}">${fmt(o)}</span></li>`).join('')}</ul>`;
    if (q.type === 'yn') h += `<ul class="actionlist">${q.statements.map((s,i) => `<li><b>${i+1}</b><span>${fmt(s.t)}</span></li>`).join('')}</ul>`;
    if (q.type === 'match') h += `<ul class="actionlist">${q.items.map((s,i) => `<li><b>${i+1}</b><span>${fmt(s.t)}</span></li>`).join('')}</ul><ul class="actionlist">${q.choices.map((o,i) => `<li><b>${L[i]}</b><span>${fmt(o)}</span></li>`).join('')}</ul>`;
    h += `<dl class="ans-grid"><dt>Your answer</dt><dd>${esc(userText(q))}</dd><dt>Correct answer</dt><dd>${esc(q.key)}</dd></dl>`;
    h += `<p class="why">${fmt(q.why)}</p>${q.extra || ''}</article>`;
  });
  h += `<div class="actions"><button class="btn primary" data-act="results">Back to score</button><button class="btn" data-act="retake">Retake exam</button></div>`;
  return h + `</main>${sheet('results')}</div>`;
}

function render(){
  const map = {intro:renderIntro, exam:renderExam, secreview:renderSecReview, results:renderResults, review:renderReview};
  app.innerHTML = (map[S.screen] || renderIntro)();
  document.getElementById('clock').hidden = !(S.screen === 'exam' || S.screen === 'secreview');
  const cp = document.getElementById('casepanel');
  if (cp) cp.addEventListener('toggle', () => { S.caseClosed = !cp.open; save(); });
  tick();
}

/* ---------- dialog ---------- */
const dlg = document.getElementById('dlg');
let onOk = null;
function ask(title, text, okLabel, fn){
  document.getElementById('dlg-t').textContent = title;
  document.getElementById('dlg-p').textContent = text;
  document.getElementById('dlg-ok').textContent = okLabel;
  onOk = fn;
  if (dlg.showModal) dlg.showModal(); else fn();
}
document.getElementById('dlg-no').addEventListener('click', () => dlg.close());
document.getElementById('dlg-ok').addEventListener('click', () => { dlg.close(); const f = onOk; onOk = null; if (f) f(); });

/* ---------- flow ---------- */
function go(screen, n){ S.screen = screen; if (n) S.n = n; save(); render(); window.scrollTo({top:0}); }
function finish(timedOut){
  if (S.finishedAt) return;
  S.finishedAt = Date.now(); S.timedOut = !!timedOut; go('results');
}
function nextSection(){
  S.sec += 1; go('exam', SECTIONS[S.sec].from);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, n = +b.dataset.n;
  if (act === 'start'){ const now = Date.now(); S = Object.assign(fresh(S.mode), {screen:'exam', startedAt:now, endAt:now + MINUTES*60000}); go('exam', 1); }
  else if (act === 'resume'){ go(S.screen === 'intro' ? 'exam' : S.screen); }
  else if (act === 'restart'){ ask('Start over?', 'Your answers and remaining time for this attempt will be cleared.', 'Start over', () => { S = fresh(S.mode); go('intro'); }); }
  else if (act === 'next'){ go('exam', S.n + 1); }
  else if (act === 'prev'){ go('exam', S.n - 1); }
  else if (act === 'goto'){ if (canGo(n)) go('exam', n); }
  else if (act === 'flag'){ S.flags[S.n] = !S.flags[S.n]; save(); render(); }
  else if (act === 'secreview'){ go('secreview'); }
  else if (act === 'goalnext'){
    const doIt = () => { S.locked[S.n] = true; if (S.n < SECTIONS[S.sec].to) go('exam', S.n + 1); else nextSection(); };
    if (status(qOf(S.n)) === 0) ask('Continue without an answer?', 'You can’t return to this question after you continue.', 'Continue', doIt); else doIt();
  }
  else if (act === 'endsec'){
    const sec = SECTIONS[S.sec];
    if (S.sec === SECTIONS.length - 1) ask('Finish the exam?', 'Your answers will be scored and you can’t change them afterwards.', 'Finish exam', () => finish(false));
    else ask(`End ${sec.name}?`, `You won’t be able to return to ${sec.label.toLowerCase()}.`, 'End section', nextSection);
  }
  else if (act === 'finish'){ ask('Finish the exam now?', 'Unanswered questions score zero, and you can’t change answers afterwards.', 'Finish exam', () => finish(false)); }
  else if (act === 'review'){ go('review'); }
  else if (act === 'results'){ go('results'); }
  else if (act === 'jump'){ S.onlyMissed = false; S.screen = 'review'; save(); render(); const el = document.getElementById('r' + n); if (el) el.scrollIntoView(); }
  else if (act === 'retake'){ ask('Retake the exam?', 'Your score and answers from this attempt will be cleared.', 'Retake', () => { S = fresh(S.mode); go('intro'); }); }
});

document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k; if (!k) return;
  if (k === 'mode'){ S.mode = t.value; save(); return; }
  if (k === 'onlymissed'){ S.onlyMissed = t.checked; save(); render(); return; }
  if (S.screen !== 'exam') return;
  const q = qOf(S.n); let a = S.answers[q.n];
  if (k === 'single') a = +t.value;
  else if (k === 'multi') a = [...app.querySelectorAll('input[data-k="multi"]:checked')].map(x => +x.value);
  else {
    a = Array.isArray(a) ? a.slice() : Array(parts(q)).fill(null);
    const j = +t.dataset.j;
    if (k === 'yn') a[j] = t.value === '1';
    else a[j] = t.value === '' ? null : +t.value;
  }
  S.answers[q.n] = a; save();
  const id = t.id, y = window.scrollY; render(); window.scrollTo({top:y});
  const el = id && document.getElementById(id); if (el) el.focus({preventScroll:true});
});

/* ---------- timer ---------- */
function tick(){
  if (!(S.screen === 'exam' || S.screen === 'secreview') || !S.endAt) return;
  const left = S.endAt - Date.now();
  if (left <= 0){ finish(true); return; }
  const el = document.getElementById('timer'); if (el) el.textContent = fmtTime(left);
  document.getElementById('clock').classList.toggle('low', left < 10*60000);
}
setInterval(tick, 1000);
render();
</script>
</body>
</html>
